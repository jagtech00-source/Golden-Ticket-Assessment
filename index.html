ery items and silent price jumps are how you work for the vendor.","body":"Credits for shorts. No unordered product unless you want it. Prices that jumped get a circle and a later call — not a shrug. Count cases.","doThis":["Keep a copy of the standing order so you can see the drift.","Date the invoice and put it in the week's folder the same day."]},{"title":"Put away, then break down cardboard","why":"Cases on the floor are how pests and inspectors both win.","body":"Right shelf, date if you open it, poultry on the bottom. Cardboard out the same hour. Do not build a fort in dry storage 'until later.' Later is Friday.","doThis":["FIFO the shelf while you are holding the new case.","Chemicals never ride in with food on the same dolly if you can help it — and never store together."]}],"checklist":["Someone is present for every protein delivery","Stem thermometer used on cold/frozen receiving","Warm or damaged product is rejected, not 'cooled later'","Invoice checked against the order; shorts credited","Product put on the correct shelf before the next rush","Cardboard broken down the same day","Invoices filed the same day"],"mistakes":["Signing while on the phone and finding thawed fish at 2 p.m.","Accepting a 'substituted' item you will never sell.","Storing the delivery on the cook line 'for now.'"],"inspectorLook":"They may ask how you handle a bad delivery. 'We take whatever' is the wrong sentence. They may also ask where receiving happens and whether raw protein crosses RTE prep.","jeffNote":"I have turned a driver around. He did not like it. The inspector never had to. Being the nice guy at the back door is how you buy a problem at the front door.","related":["storage-order","temps","pest","costing"]},{"slug":"sick","title":"Sick worker policy","kicker":"Stay home","minutes":"Write once · enforce always","category":"people","summary":"Vomit, diarrhea, jaundice, sore throat with fever, or an infected wound you cannot cover: you are not on the line. If the only cook is you, closing is legal. Cooking sick is not a flex.","why":"One sick cook can close you. Norovirus does not care about your labor budget. Inspectors will ask for the policy, then they will look at the line. The policy is paper. The culture is whether you actually send people home — including yourself.","supplies":["One-page policy","Signed copies for every person including you","A coverage / close plan","A thermometer and bandages for wounds"],"steps":[{"title":"Write it in one page","why":"A handbook nobody reads is not a policy. One page on the wall and in the hire packet is.","body":"Symptoms: vomit, diarrhea, jaundice, sore throat with fever, infected wounds that cannot be covered. Who to call. How many hours symptom-free before return — follow your health department (often 24 hours symptom-free without medicine for vomit/diarrhea; jaundice is a different, longer conversation). Exclude from food handling, not 'stay off the line but run the register.'","doThis":["Use your county's language if they give it.","Post it. File signed copies."]},{"title":"Sign on hire — including the owner","why":"If you do not sign it, it is a poster for other people.","body":"Every person, including you. File it. Re-sign annually if you want it to stay alive. New hires before they touch food.","doThis":["Keep the file with I-9s, not in a junk drawer.","Talk through one scenario in training: 'You woke up sick. What do you do?'"]},{"title":"Have a coverage plan that is not heroics","why":"If the plan is 'I come in anyway,' you do not have a plan.","body":"If the only cook is you, the plan might be: close the room, post on the door and social, text the regulars. That is legal. Cooking sick is not a flex. If you have a backup, they know how to open, close, and 86.","doThis":["Write the close script now, not from the bathroom at 4 a.m.","See solo operator survival."]}],"checklist":["One-page sick policy written with symptoms and return-to-work","Every person including the owner has signed it","Copies in the binder for the inspector","Coverage or close plan is written, not hoped","Bandages and gloves available for wounds that can be covered","Staff can tell you what symptoms send them home"],"mistakes":["Coming in to 'just do the register' after vomiting. You will touch tickets, pens, and the card terminal.","A policy that only applies to employees, not the chef-owner.","Sending someone home and then calling them at 10 a.m. because you got busy."],"inspectorLook":"They will ask for the policy. Then they will watch whether anyone on the line looks like they should be in bed. They may ask a cook directly: what would send you home?","jeffNote":"I have worked through things I should not have. That is a confession, not a method. Do not copy that part. Closing a 16-seat room for a day is cheaper than a health shut-down and a reputation you cannot plate your way out of.","related":["solo","opening","handwashing","the-binder"]},{"slug":"solo","title":"Solo operator survival","kicker":"One body, a whole restaurant","minutes":"The whole day","category":"people","summary":"A 16-seat room can be one person. It cannot be one person with no lists, no pars, and no plan for a sick day. The code does not care that you are also the dishwasher.","why":"Solo is how a lot of New York independents actually run. It is not an excuse for missing logs, missing dates, or a mystery walk-in. Lists do the remembering. A tight menu is how you survive the Saturday counter. Pride without a system is just exhaustion.","supplies":["Open / close / prep / order lists","A sick-day close plan","A menu one pair of hands can execute","A phone note for regulars if you must close"],"steps":[{"title":"Lists do the remembering","why":"If it is only in your head, it is a bet. Bets fail at 2 p.m. on a Friday.","body":"Open, close, prep, order. Printed or on a clipboard. You will be tired. The list will not be. Check the box. That is the whole management system of a one-man shop.","doThis":["Rewrite any list you skip twice. The list is wrong, or you are lying to yourself.","Hang them where you stand, not in an office you do not have."]},{"title":"A menu one pair of hands can execute","why":"Every extra pan is a minute you do not have when the counter fills.","body":"Tight menu, honest specials. If you cannot fire it, plate it, and still greet, it is not on the board. Specials exist to use on-hand product, not to prove you still have restaurant-chops from 1998.","doThis":["Count the pans on a busy Saturday. Cut one item that fights you.","Vegan specials are fine. A seven-pan vegan special is not."]},{"title":"Prep the day before","why":"Morning you should be cooking and greeting, not starting stocks from zero.","body":"Yesterday's close includes tomorrow's prep list. Cooling happens at night when you have time to do shallow pans. Morning is fire and hospitality.","doThis":["Pars on a card. Order from the card, not from fear of 86.","See costing and closing."]},{"title":"Write the sick-day plan","why":"You will be sick. The room can close. The room cannot run on vomit.","body":"Close. Call a backup. Shorten hours. Pick one and tell the regulars how they will hear about it — door sign, Instagram, a text thread. Do it before you need it.","doThis":["See sick worker policy.","A backup who can at least count the drawer and lock the door is better than a mythic second cook."]}],"checklist":["Opening list in use every day","Closing list in use every day","Prep list written the night before","Order / par card exists and is followed","Menu can be executed by one pair of hands","Sick-day plan written (close / backup / short hours)","Regulars know how they will hear if you must close","Logs are still filled — solo is not an excuse"],"mistakes":["Adding menu items because you are bored on a Tuesday.","Skipping close 'just this once' until the drain flies.","No plan for a kidney stone, a funeral, or a snow day. New York will provide all three."],"inspectorLook":"Solo is not an excuse for missing logs. The code does not care that you are also the dishwasher. They will still ask for the binder, the temps, and the sink.","jeffNote":"Seven years solo, twelve-hour days. The ticket rail and the checklists are how I still like the work. Pride without a system is just exhaustion. I am building this so you do not have to invent it at 5 a.m.","related":["opening","closing","sick","costing","the-binder"]},{"slug":"costing","title":"Menu costing","kicker":"Know the plate before you print the board","minutes":"Per item, then every Monday","category":"money","summary":"Recipe, yield, invoice price, plate cost, sell price. Specials get the same math. A pretty dish that loses $2 is a hobby. Hidden giveaways in portioning are not generosity — they are fog.","why":"Places do not die from bad pancakes. They die from not knowing the number until the rent check bounces. Inspectors will not cost your menu. Your landlord will, indirectly.","supplies":["Recipe cards","Current invoices","A scale","A simple spreadsheet or notebook","Target food-cost % you can survive"],"steps":[{"title":"Card every item","why":"If it is not written, the portion will drift and the cost with it.","body":"Ounces in, yield out, garnish included. The parsley and the lemon are not free. Butter finish is not free. A bun is not free. Allergen flags live on the same card.","doThis":["Weigh the portion once a week on a hero item. Drift is real.","Specials use the same template: name, ounces, cost, price, allergens, 86 count."]},{"title":"Price from cost, then from the block","why":"If the math needs $18 and Genesee Street will pay $12, that is a dish problem, not a customer problem.","body":"Target a food-cost mix you can live with — many independents need the mix in the high 20s to low 30s, not 22% on eggs and 55% on a morel plate unless the mix carries it. If the neighborhood will not pay, change the dish.","doThis":["Do not fall in love with a plate that cannot pay rent.","A 22% egg plate can carry a 38% special. The mix has to land."]},{"title":"Monday: purchases vs. sales","why":"A quarterly menu with weekly invoice shock is how you work for the vendor.","body":"Last week's food purchases ÷ food sales. Walk the walk-in. 86 the loser. Push the winner. Re-cost when eggs, butter, coffee, or protein jump.","doThis":["Forty-five minutes. Not a full accounting close — a directional number.","If you are throwing away dated product, you are over-prepping. Cut the par."]}],"checklist":["Every menu item has a recipe card with ounces and plate cost","Allergen flags are on the same card","Specials are costed before they hit the board","A scale exists and is used","Monday food-cost (purchases ÷ sales) is written down","Pars were cut on anything that died in the box","Invoice jumps triggered a re-cost, not a shrug"],"mistakes":["Pricing from the restaurant down the street without costing your own plate.","A 'market price' special with no math.","Giving away morels without deciding to. I give them away sometimes because I want to. That is a decision I can see."],"inspectorLook":"They will not cost your menu. Your landlord will, indirectly. The health inspector will still want the allergen matrix that lives on those same cards.","jeffNote":"I give morels away sometimes because I want to. That is a decision I can see. Hidden giveaways in portioning are not generosity — they are fog. Know the number, then be generous on purpose.","related":["date-mark","allergens","receiving","solo"]},{"slug":"cash-control","title":"Cash drawer and daily money","kicker":"Count it like it can walk","minutes":"Open and close, every day","category":"money","summary":"Starting bank written. Drawer counted twice if you are tired. Drops during the day so the drawer is not a prize. Tips handled. Comps and voids with a reason. Square is not a substitute for a close.","why":"Uncounted drawers invent theft and hide your own mistakes. A 16-seat room still takes cash. Morning math at 5 a.m. lies. Write the number. The books are how you know if the pancakes are paying the well.","supplies":["A written starting bank","A drop envelope or bag","A close sheet (cash, cards, comps, voids)","A separate place for the drop, not the junk drawer"],"steps":[{"title":"Open with a known bank","why":"If you do not know what you started with, you will never know what you made.","body":"Count the starting bank. Write it. If it is short from last night, write that too — do not silently refill from your pocket. Owner money in is an owner deposit, not a mystery.","doThis":["Same bank amount every morning if you can. Rhythm beats improvisation.","Card terminal alive before the first ticket."]},{"title":"Drops and comps","why":"A fat drawer is a target and a temptation, including for you on a bad day.","body":"Drop during a lull so the drawer stays boring. Comps and voids get a reason on the ticket or the POS note. 'Friend' is a reason. 'I messed up the order' is a reason. Silence is how food-cost and cash both vanish.","doThis":["No unpaid tabs living in a notebook if you can help it.","Staff meals are plated and recorded, not grazed."]},{"title":"Close: count, drop, three lines","why":"Tomorrow you will not remember the $20 that went to the plumber.","body":"Count cash. Compare to the POS. Write over/short. Drop. Tips out. Three lines for morning: 86s, what broke, what to order. Enter invoices the same day if you can — Friday pile is how QuickBooks becomes folklore.","doThis":["If you are short, write it. Do not borrow from tips to make it even.","Owner draw is a transfer, not a swipe at the grocery store on the way home."]}],"checklist":["Starting bank counted and written at open","Card terminal working before the first ticket","Comps and voids have a reason","Midday drop if the drawer gets fat","Close count vs. POS, over/short written","Drop secured; tips handled","Three-line note for morning written"],"mistakes":["Making the drawer even from your pocket so the sheet looks clean.","A week of invoices in the glove box of the Sequoia.","Paying vendors in cash out of the drawer with no receipt."],"inspectorLook":"They will not audit your drawer. The state tax people might. Your own Monday numbers will. Sales tax collected has to match reality — that starts with a POS and a close.","jeffNote":"I have done twelve-hour days and still counted the drawer. It is not romance. It is how I know the diner is a business, not a feeling. Feelings do not pay the well.","related":["opening","closing","costing","solo"]},{"slug":"hood-fire","title":"Hood, grease, and fire","kicker":"The tag on the Ansul","minutes":"Monthly eyes · scheduled service","category":"daily","summary":"Filters in, not sitting in a sink. Ansul currently tagged. Exits clear. Occupant load posted. A fryer under a dirty hood is a fire you already paid for. Fire marshal walks before health if you are smart.","why":"Unpermitted hood work fails the health pre-op and the insurance claim after a fire. Filters on the floor are a story. A current tag is a sentence you want to be able to say.","supplies":["Current Ansul / suppression tag","Spare clean filters if you have them","Class K extinguisher if you have fryers","A service number on the wall"],"steps":[{"title":"Filters belong in the hood","why":"A hood without filters is a grease chimney. Filters in the sink 'to soak' during service are not filtering.","body":"Clean on a schedule that matches your volume. A diner doing bacon all morning is not a once-a-month shop. Never run a shift with filters on the floor.","doThis":["If you soak filters, have a second set. Or clean before open.","Look up. Shine a light. If it is furry, call the cleaner."]},{"title":"Suppression tagged and the pull known","why":"Fire will ask. Health will ask. Your insurance will ask after.","body":"Ansul or equivalent currently tagged. Staff (including you) know where the pull is and where the extinguisher is. Class K for fryers. Do not block the pull with a coat rack.","doThis":["Say it out loud once before you open to the public: here is the pull, here is the exit.","Keep the last invoice for hood cleaning in the binder."]},{"title":"Exits, load, and grease interceptor","why":"A stacked dining room with a blocked exit is how a small fire becomes a story on the news.","body":"Occupant load posted. Exits clear. Emergency lights tested. Grease interceptor pumped on a contract, not when the sewer department calls angry.","doThis":["Walk the exit path with a bus tub in your hands. If you cannot, guests cannot.","Pump log in the binder next to pest."]}],"checklist":["Filters in the hood during service","Hood and suppression tag current","Pull station unobstructed; staff know where it is","Correct extinguisher present and charged","Exits clear; occupant load posted","Emergency lights work","Grease interceptor on a pump schedule","Hood-cleaning invoice in the binder"],"mistakes":["Running without filters because they are soaking during brunch.","A tag from a previous tenant and a hope that nobody looks.","Storing paper goods over the fryer."],"inspectorLook":"Fire marshal wants the tag, the exits, and the load. Health wants the filters in and the hood not dripping into food. Both will fail you for a theater hood.","jeffNote":"I have cooked under a hood that was tired. I do not anymore. The tag is cheaper than a fire. Filters in, pull in sight, then cook.","related":["inspection-day","opening","the-binder","closing"]},{"slug":"ice-water","title":"Ice, water, and the scoop","kicker":"Ice is food","minutes":"Daily clean · scoop discipline","category":"food-safety","summary":"Ice is food. The scoop lives outside the bin, handled, not a cup. The chute and the bin get cleaned. A well or septic in rural CNY is extra paper. Do not treat the ice machine like a closet.","why":"Inspectors open ice machines because crews use them as extra refrigeration and as a dirty-hand stop. A cup in the bin is a hand in the bin. Ice that tastes like filter can still make people sick if the bin is a science project.","supplies":["Handled scoop","A holster or tray outside the bin","Machine cleaner per manufacturer","If on a well: current water test letters"],"steps":[{"title":"Scoop discipline","why":"A glass in the ice is a guest's mouth in the ice.","body":"Handled scoop. Stored outside the bin, not buried in the ice. Never a cup, never a glass, never a bare hand. Train it like handwashing — because it is.","doThis":["Holster or a clean tray. If it has no home, it will live in the bin.","If you catch a glass in the ice, discard the ice it touched. Yes, really."]},{"title":"Clean the machine on a schedule","why":"Pink slime in a chute is a photograph.","body":"Follow the maker. Bin, chute, gaskets. Flush after clean. Do not store food in the ice bin. It is not a backup reach-in for backup shrimp.","doThis":["Write the last clean date on a card on the machine.","Look weekly. Do not wait for the smell."]},{"title":"Water source is part of the permit","why":"Municipal water is easy. A well is a packet and a lab.","body":"If you are on a well or septic in rural CNY, budget extra time for water tests. Keep the letters in the binder. Ice machines, coffee, and the hand sink all drink that water.","doThis":["Ask health on day one of the lease if the building is well/septic.","Do not open hoping the last tenant's letter still counts."]}],"checklist":["Handled scoop stored outside the ice bin","No cups, glasses, or food in the ice","Bin and chute clean; last-clean date posted","Ice machine not used as extra refrigeration","If on a well: current test letters in the binder","Hand sink actually gets hot water"],"mistakes":["The soda cup used as a scoop 'just this once.'","Bags of ice from a gas station dumped into a dirty bin.","Storing bottles in the ice that guests also drink."],"inspectorLook":"They will look for the scoop first. Then they will look at the chute. A cup in the ice is an easy, ugly mark.","jeffNote":"Ice is food. I say it to myself when I am in a hurry. The scoop has a home. If it does not, I built it wrong.","related":["sanitizing","opening","the-binder","handwashing"]},{"slug":"the-binder","title":"The inspection binder","kicker":"One binder, labeled, not a junk drawer","minutes":"Build once · update weekly","category":"inspection","summary":"CFPM card, permit, pest log, temp logs, sick policy, allergen matrix, last inspection, SDS, hood tag copy, insurance certs. One binder. The inspector should be able to sit down and read your operation without a scavenger hunt.","why":"The pre-op and every visit after is half the room and half the paper. A complete binder does not pass a dirty walk-in. An empty binder can fail a clean one. Build it before you need it.","supplies":["A 2-inch binder","Tabs","Sheet protectors","A weekly 10-minute update habit"],"steps":[{"title":"The tabs","why":"If you cannot find it in 30 seconds, you do not have it.","body":"Suggested tabs: Permit & CFPM · Temps (30 days) · Pest · Sick policy · Allergen matrix · SDS · Fire/hood · Insurance · Last inspection · Vendor invoices (current week). Label the spine: GOLDEN TICKET / [YOUR DBA] / CURRENT YEAR.","doThis":["Put a table of contents on page one.","A second copy of the CFPM card posted in the office or on the wall."]},{"title":"What goes in every week","why":"A binder from opening day that died in March is a prop.","body":"Temp logs. Pest service if it happened. Any new SDS. The last invoice set if you keep them there. Nothing 'I will print it when they call.'","doThis":["Ten minutes on Monday with the food-cost close.","Replace expired strips log / note when you opened a new bottle of sanitizer."]},{"title":"What does not go in","why":"A junk drawer with a spine is still a junk drawer.","body":"Takeout menus, expired insurance, last year's labor posters, a recipe you might run someday. Current. Readable. True.","doThis":["Archive old inspections in the back, do not mix them with current temps.","If a page is coffee-soaked, reprint it."]}],"checklist":["Binder exists and is labeled","Permit (or application receipt) and CFPM card","Last 30 days of temp logs","Pest contract, map, last service","Signed sick policies","Allergen matrix current","SDS for every chemical on the rack","Hood / Ansul tag copy and last cleaning invoice","Insurance certificates","Last inspection report with corrections noted"],"mistakes":["A beautiful binder and a filthy walk-in. Paper does not wash gaskets.","Keeping it in the car so it 'stays nice.' It has to live in the room.","Pages from a Facebook group instead of your actual logs."],"inspectorLook":"They will ask for the binder. Hand it over. Do not narrate while they read. If you have to leave the room to 'find' the CFPM card, they already scored you.","jeffNote":"I want the visit to be dull. Dull means the systems worked. The binder is how you start dull. The walk-in is how you finish dull.","related":["inspection-day","temps","pest","sick","allergens"]},{"slug":"inspection-day","title":"Health inspection day","kicker":"Be boring","minutes":"The visit is an hour · the prep is every day","category":"inspection","summary":"Binder out, lights on, no speeches. Wash your hands where they can see. Let them lead. Fix what you can in front of them. Read the report before they leave. Dull is the win.","why":"They have seen every performance. Clean, documented, and calm is the only one that works. Drama means you got busy and got sloppy. This platform exists so this hour is boring.","supplies":["The binder","A clean towel and a calm room","The self-inspection from this app, honestly scored yesterday"],"steps":[{"title":"The day before is the inspection","why":"You cannot clean a walk-in during the hello.","body":"Run the Inspection tool in this app. Criticals first: temps, hand sinks, sanitizer, storage order, pest, date marks. Photograph the walk-in. If you would not post it, fix it. Binder current.","doThis":["Do not reconstruct a week's temp log. That is a different kind of fail.","Staff (or you) know where the pull station, the binder, and the restroom are."]},{"title":"When they walk in","why":"The first 60 seconds set the tone.","body":"Greet. Wash your hands where they can see. Offer the binder. Let them lead. Answer what was asked. Do not narrate your life story over a dirty gasket. Do not follow so close you are hovering.","doThis":["If you are in the weeds, still wash. The ticket can wait 20 seconds.","Turn down the music if it is a wall of sound. They need to talk."]},{"title":"If something is wrong","why":"Hiding is the thing they remember.","body":"Fix it in front of them if you can — clear the hand sink, change the sanitizer, move the chicken to the bottom. Do not hide a pan in the office. Do not argue gravity or the code. You can ask how to close a violation. You cannot win a debate during the walk.","doThis":["Take notes. Their words, not your feelings.","If you do not understand a mark, ask once, clearly."]},{"title":"After they leave","why":"The report is the work order, not a review you argue with on Facebook.","body":"Read the report before they leave if they will let you. Ask how to close any violation. Put the report in the binder. Do the thing that day. If it is a re-inspection, put it on the calendar like rent.","doThis":["Tell the crew (or write it to yourself) what changed.","A critical is not a personality. It is a fix."]}],"checklist":["Self-inspection in this app scored honestly within 24 hours","Criticals from that self-audit are fixed","Binder in the room, tabs current","Walk-in would survive a photograph","Hand sinks stocked and clear","Sanitizer tested this morning","You know where the Ansul pull and the restroom are","After: report in the binder; corrections started the same day"],"mistakes":["A speech about how long you have been cooking instead of a clean gasket.","Following them with excuses. Let the room talk.","Waiting a week to fix a critical because 'we passed overall.'"],"inspectorLook":"They have seen every performance. Clean, documented, and calm is the only one that works. They are not your enemy. They are not your friend. They are the exam.","jeffNote":"I want the visit to be dull. Dull means the systems worked. Drama means I got busy and got sloppy. Run the self-audit. Fix the red. Then cook breakfast.","related":["the-binder","storage-order","temps","handwashing","pest"]}],"PLAYBOOK_CATEGORIES":[{"id":"food-safety","label":"Food safety"},{"id":"daily","label":"Daily ops"},{"id":"people","label":"People"},{"id":"money","label":"Money"},{"id":"inspection","label":"Inspection"}],"INSPECTION":[{"id":"i1","category":"Hands & health","title":"Hand sinks stocked and unblocked","detail":"Soap, hot water, towels, trash. Not used as a dump sink.","critical":true},{"id":"i2","category":"Hands & health","title":"Handwash signs posted","detail":"At every hand sink, including restroom.","critical":false},{"id":"i3","category":"Hands & health","title":"Sick worker policy signed and available","detail":"Staff can tell you what symptoms send them home.","critical":true},{"id":"i4","category":"Hands & health","title":"No bare-hand contact with ready-to-eat food","detail":"Gloves, tongs, or paper — after washing.","critical":true},{"id":"i5","category":"Hands & health","title":"Restroom clean, stocked, self-closing door if required","detail":"Soap, towels, trash, working toilet.","critical":false},{"id":"i6","category":"Temperature","title":"Stem thermometer present and calibrated","detail":"Ice-point 32°F. Extra battery or extra thermometer.","critical":true},{"id":"i7","category":"Temperature","title":"Cold holding at 41°F or below","detail":"Walk-in, reach-ins, prep rails. Logs match product.","critical":true},{"id":"i8","category":"Temperature","title":"Hot holding at 135°F or above","detail":"Check the actual food, not the well setting.","critical":true},{"id":"i9","category":"Temperature","title":"Cooking temperatures known and checked","detail":"Poultry 165, ground 155, fish/whole muscle 145.","critical":true},{"id":"i10","category":"Temperature","title":"Cooling done in shallow pans","detail":"No deep stockpots in the walk-in 'to cool overnight.'","critical":true},{"id":"i11","category":"Temperature","title":"Temperature logs filled for today","detail":"Morning and afternoon. Real numbers.","critical":false},{"id":"i12","category":"Storage","title":"Raw poultry on the bottom shelf, in pans","detail":"Nothing ready-to-eat under raw animal food.","critical":true},{"id":"i13","category":"Storage","title":"Food 6 inches off the floor","detail":"Shelving, not crates forever.","critical":false},{"id":"i14","category":"Storage","title":"Food covered and labeled","detail":"Name plus date on prepped TCS food.","critical":false},{"id":"i15","category":"Storage","title":"Date marks within 7 days","detail":"Opened and prepped TCS food. Toss what is tired.","critical":true},{"id":"i16","category":"Storage","title":"Chemicals stored away from food","detail":"Labeled bottles. SDS in the binder.","critical":true},{"id":"i17","category":"Warewash","title":"Sanitizer at the correct concentration","detail":"Strips match the chemical. Bucket not greasy.","critical":true},{"id":"i18","category":"Warewash","title":"Dish machine or three-bay set up correctly","detail":"Wash, rinse, sanitize. Drainboards. Air dry.","critical":true},{"id":"i19","category":"Warewash","title":"Wiping cloths in sanitizer","detail":"Not on the cutting board, not in a pocket.","critical":false},{"id":"i20","category":"Pest & outside","title":"No evidence of pests","detail":"Droppings, gnawing, fruit flies breeding in drains.","critical":true},{"id":"i21","category":"Pest & outside","title":"Pest contract and bait map on file","detail":"Current service. Technician license if required.","critical":false},{"id":"i22","category":"Pest & outside","title":"Dumpster lids closed, pad reasonably clean","detail":"Away from the door if possible.","critical":false},{"id":"i23","category":"Pest & outside","title":"Door sweeps; no daylight under the back door","detail":"Screen if the door stays open.","critical":false},{"id":"i24","category":"Facility","title":"Floors, walls, ceilings cleanable and in good repair","detail":"No peeling paint over the line. Coved base where required.","critical":false},{"id":"i25","category":"Facility","title":"Hood and Ansul currently tagged","detail":"Filters in, not sitting in a sink.","critical":true},{"id":"i26","category":"Facility","title":"Lighting working; shields where required","detail":"Over food and prep.","critical":false},{"id":"i27","category":"Facility","title":"Mop sink and floor drains clean","detail":"No standing sewage smell.","critical":false},{"id":"i28","category":"Facility","title":"Ice machine clean; scoop stored outside the bin","detail":"Handled scoop, not a cup.","critical":false},{"id":"i29","category":"Paper","title":"Valid permit posted (or application in process for pre-op)","detail":"CFPM card available.","critical":true},{"id":"i30","category":"Paper","title":"Allergen matrix at the pass","detail":"Staff can use it without guessing.","critical":false},{"id":"i31","category":"Paper","title":"Labor posters, choke chart, occupancy posted","detail":"Current year posters.","critical":false},{"id":"i32","category":"Paper","title":"Shellfish tags or other required source records if you serve them","detail":"90 days on tags if applicable.","critical":true}],"QUIZ":[{"id":"q1","prompt":"Where does raw chicken belong in the walk-in?","choices":["Top shelf, it is expensive","Next to the cut lettuce so you remember it","Bottom shelf, in a pan, under everything ready-to-eat","Wherever there is space"],"answer":2,"why":"Drip is the risk. Poultry cooks to the highest temperature, so it lives at the bottom."},{"id":"q2","prompt":"Cold holding for TCS food must be at or below:","choices":["50°F","45°F","41°F","35°F"],"answer":2,"why":"41°F is the line. A rail at 45°F is not 'close enough.'"},{"id":"q3","prompt":"Poultry is safely cooked when the thickest part hits:","choices":["145°F","155°F","165°F","180°F"],"answer":2,"why":"165°F for poultry. Use a stem thermometer, not the color of the juice."},{"id":"q4","prompt":"The correct order for warewashing is:","choices":["Sanitize, wash, rinse","Wash, rinse, sanitize, air dry","Wash, sanitize, rinse, towel dry","Rinse, sanitize, wash"],"answer":1,"why":"Sanitizer only works on a clean surface. Towels re-soil. Air dry."},{"id":"q5","prompt":"Opened chili held at 41°F must be discarded after:","choices":["3 days","7 days including the day it was made","14 days if it still smells fine","When you remember"],"answer":1,"why":"Seven-day date mark for TCS food at 41°F, counting today."},{"id":"q6","prompt":"A cook has been vomiting since 4 a.m. The correct move is:","choices":["Come in, stay off the line, run the register","Come in if you wear two pairs of gloves","Stay home and follow the return-to-work policy","Come in late after a nap"],"answer":2,"why":"Norovirus and friends do not care about your labor budget. Stay home."},{"id":"q7","prompt":"Hot food must be held at or above:","choices":["120°F","135°F","165°F","212°F"],"answer":1,"why":"135°F hot hold. Reheating to 165°F is a different step."},{"id":"q8","prompt":"A guest asks if the vegan special has dairy. You are not sure. You:","choices":["Say it should be fine","Say you are vegan-friendly so it is fine","Check the card / recipe and answer from that","Ask the table next to them"],"answer":2,"why":"Guessing is how people get hurt. The card is the answer."},{"id":"q9","prompt":"Cooling a pot of soup the right way means:","choices":["Lid on, in the walk-in, check tomorrow","Shallow pans, 135 to 70 in 2 hours, then to 41 in 4 more","On the counter until it 'stops steaming'","In the freezer in the stockpot"],"answer":1,"why":"The two-stage cooling curve is the law and the science."},{"id":"q10","prompt":"Sanitizer buckets should be:","choices":["Mixed by eye, 'stronger is better'","Tested with the matching strips at the right ppm","Left overnight so they stay potent","Used as a first wash instead of soap"],"answer":1,"why":"Too weak does nothing. Too strong is not more professional. Strips."},{"id":"q11","prompt":"A delivery of chicken arrives at 48°F. You:","choices":["Put it in the walk-in to catch up","Cook it all immediately","Reject the product and call the vendor","Sign and deal with it later"],"answer":2,"why":"You cannot cool your way out of a temperature-abused delivery. Refuse it."},{"id":"q12","prompt":"Gloves should be changed:","choices":["Once a shift","When they look dirty, only","After raw protein, after contamination, and before ready-to-eat — and after washing hands","Never if they are nitrile"],"answer":2,"why":"Gloves are a tool, not a force field. Wash, then new gloves."}],"ASSESSMENT":[{"id":"a1","prompt":"Where is the project, honestly?","options":[{"id":"idea","label":"Still a concept — no site yet","points":8},{"id":"site","label":"Site picked or lease in motion","points":14},{"id":"build","label":"Build-out or renovation underway","points":16},{"id":"permits","label":"Ready to file or already filing with health","points":18},{"id":"open","label":"Open, and trying to get tighter","points":15}]},{"id":"a2","prompt":"Have you formed the entity and pulled an EIN?","options":[{"id":"no","label":"Not yet","points":4},{"id":"llc","label":"LLC filed, EIN still pending","points":12},{"id":"both","label":"LLC and EIN in the binder","points":20}]},{"id":"a3","prompt":"Health department — have you spoken to them?","options":[{"id":"no","label":"Not yet. I figured I would when the room was pretty","points":3},{"id":"called","label":"I have the packet and a name","points":12},{"id":"plans","label":"Plan review in or approved","points":18},{"id":"permit","label":"Permit in hand or pre-op scheduled","points":20}]},{"id":"a4","prompt":"Certified Food Protection Manager","options":[{"id":"none","label":"Nobody has the cert yet","points":4},{"id":"booked","label":"Class is booked","points":12},{"id":"card","label":"Card in the binder","points":20}]},{"id":"a5","prompt":"Kitchen systems — hood, sinks, cold holding","options":[{"id":"unknown","label":"I have not walked it with a checklist","points":4},{"id":"gaps","label":"I know the gaps and have a bid","points":12},{"id":"ready","label":"Hood tagged, sinks right, boxes holding 41°F","points":20}]},{"id":"a6","prompt":"Menu costing","options":[{"id":"vibes","label":"I know what I want to cook","points":6},{"id":"prices","label":"I have prices, not plate costs","points":12},{"id":"cards","label":"Recipe cards with costs and allergens","points":20}]},{"id":"a7","prompt":"Staffing reality","options":[{"id":"solo-hope","label":"It will just be me, no written backup","points":8},{"id":"solo-plan","label":"Solo (or tiny crew) with lists and a sick-day plan","points":16},{"id":"crew","label":"Crew hired and training on the books","points":18}]},{"id":"a8","prompt":"Biggest landmine right now","options":[{"id":"permits","label":"Permits and timelines — I cannot see the order","points":6},{"id":"inspect","label":"Passing inspection","points":8},{"id":"money","label":"Cash through the first 90 days","points":8},{"id":"systems","label":"Daily systems so it does not fall apart","points":10},{"id":"all","label":"All of it. I need a sequence.","points":5}]}],"PERMITS":[{"id":"llc","title":"NY LLC filing","agency":"NYS Department of State","wait":"1–10 days","dependsOn":[],"notes":"Do this before the bank, the EIN conversation with vendors, and most applications. Publication rules still exist in many counties."},{"id":"ein","title":"EIN","agency":"IRS","wait":"Same day online","dependsOn":["llc"],"notes":"Free. Print the confirmation. You will show it a dozen times."},{"id":"bank","title":"Business bank account","agency":"Your bank","wait":"1 day","dependsOn":["llc","ein"],"notes":"Needed before deposits, Square payouts, and vendor drafts."},{"id":"sales-tax","title":"Certificate of Authority","agency":"NYS Tax and Finance","wait":"Days to 2 weeks","dependsOn":["ein"],"notes":"Register before you sell. Post it."},{"id":"insurance","title":"Liability + workers' comp certificates","agency":"Carrier","wait":"3–10 days","dependsOn":["llc"],"notes":"Landlord, sometimes the town, and you after the first incident."},{"id":"co","title":"Certificate of Occupancy / change of use","agency":"City or town building department","wait":"2–8 weeks if a change of use","dependsOn":[],"notes":"Confirm food service is an allowed use before you fund a build-out."},{"id":"building","title":"Building / plumbing / electrical permits","agency":"Building department","wait":"Tied to scope","dependsOn":["co"],"notes":"Hood work, walls, new sinks. Unpermitted work fails health and insurance."},{"id":"fire","title":"Fire marshal / suppression tag","agency":"Fire department","wait":"Scheduled inspection","dependsOn":["building"],"notes":"Ansul current. Exits and occupant load posted. Do this before the health pre-op."},{"id":"plan-review","title":"Health plan review","agency":"County health department","wait":"2–6 weeks","dependsOn":["co"],"notes":"Layout, finishes, menu, equipment specs. Call them the week the lease is real."},{"id":"cfpm","title":"Certified Food Protection Manager","agency":"Accredited course (e.g. ServSafe)","wait":"1–2 days of class","dependsOn":[],"notes":"Can run in parallel with everything. Do not leave it for the week of opening."},{"id":"food-permit","title":"Food service permit + pre-operational inspection","agency":"County health department","wait":"2–4 weeks after a complete packet, then a scheduled walk","dependsOn":["plan-review","cfpm","fire","insurance"],"notes":"This is the gate. The Inspection tool in this app is the dress rehearsal."},{"id":"sla","title":"Liquor license (only if you serve)","agency":"NYS Liquor Authority","wait":"Often 3–8 months","dependsOn":["llc","co"],"notes":"Start the day the lease is real or skip it and open as a diner. Do not pin your date on SLA."},{"id":"sign","title":"Sign permit","agency":"Municipality","wait":"2–6 weeks","dependsOn":["co"],"notes":"Optional for opening the door. Not optional if the sign is already built."}],"LAUNCH_DAYS":[{"day":1,"title":"Open quiet","focus":"Systems over spectacle.","mustDo":["Run the opening list and log temps before the door turns.","Serve a tight menu — not the whole dream board.","Close on the list even if you are dragging."]},{"day":2,"title":"Fix yesterday","focus":"One operational snag, not a new menu.","mustDo":["Write the three things that broke.","Fix the printer, the 86 communication, or the rail — whichever bit you.","Thank the people who came anyway."]},{"day":3,"title":"Pars, not panic","focus":"Order from what sold, not from fear of 86.","mustDo":["Count the walk-in.","Cut anything that did not move.","Keep the allergen card current if a special ran."]},{"day":5,"title":"First Friday","focus":"Labor and ticket times.","mustDo":["Do not add menu items because you are bored.","Pre-close the pit during the lull.","Cash drawer counted twice."]},{"day":7,"title":"Week one close","focus":"Numbers and a night off the adrenaline.","mustDo":["Food purchases vs. food sales — even a rough number.","Pest check: dumpster, door sweep, floor drains.","Write next week's special from on-hand product."]},{"day":10,"title":"Inspection posture","focus":"Assume they walk in today.","mustDo":["Logs real, not reconstructed.","Walk-in photographed. If you would not post it, fix it.","Sanitizer strips in date."]},{"day":14,"title":"Two-week menu trim","focus":"Kill a loser, support a winner.","mustDo":["Drop the item that fights the line.","Re-cost anything with a jumped invoice.","Ask three regulars what they would miss."]},{"day":21,"title":"Labor honesty","focus":"Schedule to the room you have.","mustDo":["If you are solo, the sick-day plan is written and posted in your own phone.","Cut a shift that is pride, not covers.","Train one backup task (deposit, close, or order)."]},{"day":30,"title":"Stay-open review","focus":"Habits, not heroics.","mustDo":["Open/close lists still in use — or rewrite them so they will be.","Binder complete: permit, CFPM, pest, temps, last invoice set.","Pick one playbook to retrain this week. Not all of them."]}],"TRUCKS":[{"id":"t1","title":"A truck is still a food service establishment","body":"New York treats mobile units as food service. You still need a permit, a certified person, handwashing, and a commissary in most counties. A pretty trailer is not a loophole."},{"id":"t2","title":"Commissary is the mothership","body":"Prep, storage, dumping, and water often must happen at an approved commissary — not a home kitchen. Get the letter from the commissary operator and keep it with the mobile permit."},{"id":"t3","title":"Water, waste, and the hand sink","body":"Potable water tank, waste tank larger than the fresh tank, a hand sink that works when you are parked on a grade. Inspectors will ask you to turn it on."},{"id":"t4","title":"Fire suppression on the truck","body":"If you have a fryer or a griddle under a hood, you need suppression and an extinguisher that matches the fuel. Event promoters will ask before they let you on the grass."},{"id":"t5","title":"Where you park is a permit too","body":"City streets, private lots, festivals, and county fairs are different permissions. Utica and Oneida County are not the same conversation as a private wedding. Get it in writing."},{"id":"t6","title":"Menu discipline on a 6-foot line","body":"If it does not fit in the wells you have, it is not on the truck. Cost it. Allergen it. 86 with a sign, not a shrug in a generator roar."},{"id":"t7","title":"Same storage rules, smaller box","body":"Raw still goes below ready-to-eat. Date marks still exist. A cooler packed like a Tetris accident will be 50°F in the center by lunch."},{"id":"t8","title":"Consulting the truck the same way as the room","body":"Golden Ticket treats carts and trucks as a launch: entity, commissary, mobile permit, fire, event calendar, and a close-down list. Do not build the brand before the tank test."}],"GRANTS":[{"title":"Empire State Development","body":"NY's economic development agency. Small business programs, regional offices, and grant/loan products change with the budget year. Golden Ticket is built to sit beside ESD's mission: more businesses that survive year one.","href":"https://esd.ny.gov/"},{"title":"Mohawk Valley EDGE","body":"Regional partner for Oneida and the valley. Site, incentive, and connection work for operators who are actually going to hire and stay.","href":"https://www.mvedge.org/"},{"title":"MVCC thINCubator (Utica)","body":"Where this platform is meant to live as a free tool for people who will do the work. Workshops, mentors, and a front door in Utica — not a theory from the city.","href":"https://www.mvcc.edu/"},{"title":"NY Business Express","body":"One door for many state filings: sales tax, licenses, and the map of what your county still wants on paper.","href":"https://www.businessexpress.ny.gov/"},{"title":"County health + local IDA","body":"Your inspector and your industrial development / local development corp are not the enemy. Call them early. Bring a complete packet. That is the whole strategy.","href":"https://www.ocgov.net/"}]};
    const storeKey = "golden-ticket-progress";

      try { return JSON.parse(localStorage.getItem(storeKey) || "{}"); } catch { return {}; }

    let state = Object.assign({ checks: {}, inspect: {}, quiz: {}, assessment: {}, pb: {} }, load());
if (!state.pb) state.pb = {};
    function route() {
      const hash = (location.hash || "#/").replace(/^#/, "") || "/";
      return hash.startsWith("/") ? hash : "/" + hash;
    }
    function pct() {
      const n = DATA.TASKS.filter(t => state.checks[t.id]).length;
      return Math.round((n / DATA.TASKS.length) * 100);

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));

    function layout(inner) {

        ["/app","Board"],["/blueprint","Blueprint"],["/permits","Permits"],
        ["/inspection","Inspection"],["/playbooks","Playbooks"],["/launch","30 days"],
        ["/quiz","Quiz"],["/trucks","Trucks"],["/grants","Grants"],["/assessment","Assessment"]

            <small>${state.inspect[i.id]||""}</small>
          </p>
        </article>`).join("")}`);
    }
    function pbStats(slug) {
      const b = DATA.PLAYBOOKS.find(p => p.slug === slug);
      if (!b) return { done:0, total:0, pct:0 };
      const total = b.checklist.length;
      const done = b.checklist.filter((_,i) => state.pb[slug+"::"+i]).length;
      return { done, total, pct: total ? Math.round(done/total*100) : 0 };
    }
    function playbooks() {
      const r = route();
      if (r.startsWith("/playbook/")) {
        const slug = r.slice("/playbook/".length);
        const b = DATA.PLAYBOOKS.find(p => p.slug === slug);
        if (!b) return layout("<p>Not found.</p>");
        const st = pbStats(b.slug);
        const idx = DATA.PLAYBOOKS.findIndex(p => p.slug === b.slug);
        const prev = idx > 0 ? DATA.PLAYBOOKS[idx-1] : null;
        const next = idx < DATA.PLAYBOOKS.length-1 ? DATA.PLAYBOOKS[idx+1] : null;
        const cat = (DATA.PLAYBOOK_CATEGORIES || []).find(c => c.id === b.category);
        const supplies = (b.supplies||[]).map(s => '<span class="supply">'+esc(s)+'</span>').join("");
        const steps = b.steps.map((s,i) => {
          const dos = (s.doThis||[]).map(d => '<li style="display:flex;gap:8px"><span class="dot"></span><span>'+esc(d)+'</span></li>').join("");
          return '<article class="task"><small class="gold">'+String(i+1).padStart(2,"0")+'</small><h3 style="color:var(--navy)">'+esc(s.title)+'</h3><p><b>Why: </b>'+esc(s.why||"")+'</p><p>'+esc(s.body)+'</p><ul>'+dos+'</ul></article>';
        }).join("");
        const checks = b.checklist.map((item,i) => {
          const on = !!state.pb[b.slug+"::"+i];
          return '<button class="pb-check '+(on?"on":"")+'" data-pb="'+b.slug+"::"+i+'"><span class="box"></span><span>'+esc(item)+'</span></button>';
        }).join("");
        const mistakes = (b.mistakes||[]).map(m => '<li style="display:flex;gap:8px"><span class="dot" style="background:var(--danger)"></span><span>'+esc(m)+'</span></li>').join("");
        const related = (b.related||[]).map(slug => {
          const rel = DATA.PLAYBOOKS.find(p => p.slug === slug);
          return rel ? '<a class="chip" href="#/playbook/'+rel.slug+'">'+esc(rel.title)+'</a>' : '';
        }).join("");
        return layout(
          '<a class="print-hide" href="#/playbooks">← All playbooks</a>' +
          '<div class="print-hide" style="float:right"><button class="btn ghost" onclick="window.print()">Print</button></div>' +
          '<p class="gold" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700">'+(cat?esc(cat.label):"")+' · '+esc(b.kicker)+'</p>' +
          '<h1 style="color:var(--navy);margin:8px 0">'+esc(b.title)+'</h1>' +
          '<p class="muted">'+esc(b.minutes)+'</p>' +
          '<p class="muted" style="max-width:640px;line-height:1.6">'+esc(b.summary)+'</p>' +
          '<article class="task"><h3 style="color:var(--navy)">Why this exists</h3><p>'+esc(b.why)+'</p>' +
          '<p class="gold" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700">Have these on the property</p><p>'+supplies+'</p></article>' +
          '<h2 style="color:var(--navy)">How to do it</h2>' + steps +
          '<article class="task"><div style="display:flex;justify-content:space-between"><h3 style="color:var(--navy);margin:0">Do-this checklist</h3><small class="muted">'+st.done+'/'+st.total+'</small></div>' +
          '<div class="bar"><i style="width:'+st.pct+'%"></i></div>' + checks + '</article>' +
          '<article class="task"><h3 style="color:var(--navy)">Common mistakes</h3><ul>'+mistakes+'</ul></article>' +
          '<div class="card" style="background:var(--navy);color:var(--cream);border:0"><h3 class="gold">What the inspector looks for</h3><p>'+esc(b.inspectorLook)+'</p><h3 class="gold">Jeff\'s note</h3><p>'+esc(b.jeffNote)+'</p></div>' +
          (related ? '<p style="margin-top:20px"><b>Related playbooks</b></p>'+related : '') +
          '<p class="print-hide" style="display:flex;justify-content:space-between;margin-top:24px">' +
          (prev ? '<a href="#/playbook/'+prev.slug+'">← '+esc(prev.title)+'</a>' : '<span></span>') +
          (next ? '<a href="#/playbook/'+next.slug+'">'+esc(next.title)+' →</a>' : '') +
          '</p>'
        );
      }
      const cat = r.startsWith("/playbooks/") ? r.slice("/playbooks/".length) : "all";
      const list = cat === "all" ? DATA.PLAYBOOKS : DATA.PLAYBOOKS.filter(p => p.category === cat);
      const cats = DATA.PLAYBOOK_CATEGORIES || [];
      const chips = '<a class="chip '+(cat==="all"?"on":"")+'" href="#/playbooks">All</a>' +
        cats.map(c => '<a class="chip '+(cat===c.id?"on":"")+'" href="#/playbooks/'+c.id+'">'+esc(c.label)+'</a>').join("");
      const cards = list.map(p => {
        const st = pbStats(p.slug);
        const cl = cats.find(c => c.id === p.category);
        return '<a class="task" href="#/playbook/'+p.slug+'" style="display:block;text-decoration:none">' +
          '<div style="display:flex;justify-content:space-between;gap:8px"><small class="gold">'+esc(p.kicker)+'</small><small class="muted">'+esc(cl?cl.label:"")+'</small></div>' +
          '<h3 style="color:var(--navy);margin:6px 0">'+esc(p.title)+'</h3>' +
          '<p class="muted">'+esc(p.summary)+'</p>' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>'+esc(p.minutes)+'</span><span>'+st.done+'/'+st.total+' checks</span></div>' +
          '<div class="bar" style="margin-top:8px"><i style="width:'+st.pct+'%"></i></div>' +
          '<p style="font-weight:600;color:var(--navy);margin:10px 0 0">Open full instructions →</p></a>';
      }).join("");
      return layout('<h1 style="color:var(--navy)">Operational playbooks</h1>' +
        '<p class="muted" style="max-width:640px">Twenty complete procedures. Click any card for why it exists, what to have on the property, step-by-step instructions, a checklist you can tick, and the mistakes that fail rooms.</p>' +
        '<p>'+chips+'</p>'+cards);
    }

    function launch() {
      return layout(`<h1 style="color:var(--navy)">The first 30 days.</h1>
        ${DATA.LAUNCH_DAYS.map(d => `<article class="task"><small class="gold">Day ${d.day}</small><h3>${esc(d.title)}</h3>
          <p class="muted">${esc(d.focus)}</p><ul>${d.mustDo.map(m=>"<li>"+esc(m)+"</li>").join("")}</ul></article>`).join("")}`);
    }
    function quiz() {
      return layout(`<h1 style="color:var(--navy)">Twelve questions. No trick poetry.</h1>
        ${DATA.QUIZ.map((q,i) => `<article class="task"><small>${String(i+1).padStart(2,"0")}</small>
          <h3>${esc(q.prompt)}</h3>
          ${q.choices.map((c,idx) => `<div><label><input type="radio" name="${q.id}" data-quiz="${q.id}" value="${idx}" ${state.quiz[q.id]===idx?"checked":""}/> ${esc(c)}</label></div>`).join("")}
          ${state.quiz[q.id]!==undefined ? "<p class=muted>"+esc(q.why)+"</p>" : ""}
        </article>`).join("")}`);
    }
    function assessment() {
      const max = DATA.ASSESSMENT.reduce((s,q)=>s+Math.max(...q.options.map(o=>o.points)),0);
      const score = DATA.ASSESSMENT.reduce((s,q)=>{
        const o = q.options.find(x => x.id === state.assessment[q.id]);
        return s + (o ? o.points : 0);
      },0);
      const done = DATA.ASSESSMENT.every(q => state.assessment[q.id]);
      const p = Math.round(score/max*100);
      return layout(`<h1 style="color:var(--navy)">Launch readiness assessment</h1>
        ${DATA.ASSESSMENT.map((q,i)=>`<fieldset class="task"><legend><b>${String(i+1).padStart(2,"0")}</b> ${esc(q.prompt)}</legend>
          ${q.options.map(o=>`<div><label><input type="radio" name="${q.id}" data-as="${q.id}" value="${o.id}" ${state.assessment[q.id]===o.id?"checked":""}/> ${esc(o.label)}</label></div>`).join("")}
        </fieldset>`).join("")}
        ${done ? `<div class="card" style="background:var(--navy);color:var(--cream);border:0"><h2 class="gold">Your score: ${p}</h2>
          <p>${p>=80?"Strong binder.":p>=55?"A foundation with gaps.":"You are early — get the sequence straight before finishes."}</p>
          <a class="btn" href="#/blueprint">Open the blueprint</a></div>` : "<p class=muted>Answer all eight to generate the score.</p>"}`);
    }
    function trucks() {
      return layout(`<h1 style="color:var(--navy)">A truck is not a shortcut.</h1>
        ${DATA.TRUCKS.map((t,i)=>`<article class="task"><small>${String(i+1).padStart(2,"0")}</small><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p></article>`).join("")}`);
    }
    function grants() {
      return layout(`<h1 style="color:var(--navy)">Help that already exists. Use it.</h1>
        ${DATA.GRANTS.map(g=>`<a class="task" href="${g.href}" target="_blank" rel="noreferrer" style="display:block;text-decoration:none"><h3 style="color:var(--navy)">${esc(g.title)}</h3><p class="muted">${esc(g.body)}</p></a>`).join("")}`);
    }
    function about() {
      return `<article class="wrap" style="max-width:720px;padding:48px 16px">
        <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700">Golden Rule Consulting</div>
        <h1 style="color:var(--navy);font-size:40px">Chef Jeff Golden</h1>
        <p class="muted" style="font-size:18px">Forty-two years in New York hospitality. High-volume rooms, classrooms, and a 16-seat diner he still opens himself.</p>
        <h2 style="color:var(--navy)">The line</h2>
        <p>Turning Stone Resort Casino. Colgate University dining. Compass Group classrooms in the 1990s teaching health and safety. Then Golden's Food LLC at 244 Genesee Street in Utica: breakfast, lunch, chalkboard specials, vegan plates, morels when the season is kind.</p>
        <h2 style="color:var(--navy)">Why the ticket exists</h2>
        <p>Good concepts die of permits, failed inspections, and the first 90 days without a close-down list. The platform is free. Paid sessions are for operators who will do the work.</p>
        <a class="btn" href="#/contact">Book a session</a>
      </article>`;
    }
    function partners() {
      return `<article class="wrap" style="max-width:720px;padding:48px 16px">
        <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700">For government & economic development</div>
        <h1 style="color:var(--navy)">A tool that matches the mission.</h1>
        <p class="muted">Empire State Development wants fewer small-business funerals. County health wants operators who show up ready. Golden Ticket is the practical layer between those two sentences.</p>
        <div class="card">Statewide sequence for restaurant and mobile food launches.</div>
        <div class="card" style="margin-top:10px">Measurable readiness: blueprint completion, inspection self-score, CFPM status.</div>
        <div class="card" style="margin-top:10px">Ready for pilots in the Mohawk Valley — Utica, Oneida County, MVCC thINCubator.</div>
        <p><a class="btn" href="#/contact">Schedule a partnership talk</a></p>
      </article>`;
    }
    function contact() {
      return `<article class="wrap" style="max-width:640px;padding:48px 16px">
        <h1 style="color:var(--navy)">Talk to Jeff.</h1>
        <p class="muted">Strategy sessions, launch walk-throughs, and partnership talks. The platform stays free.</p>
        <p>Golden's Food · 244 Genesee Street, Utica, NY<br><a href="mailto:jagtech00@gmail.com">jagtech00@gmail.com</a></p>
        <p><a class="btn" href="mailto:jagtech00@gmail.com?subject=Golden%20Ticket%20session">Email Jeff</a></p>
      </article>`;
    }
    function render() {
      const r = route();
      let html = "";
      if (r === "/" ) html = home();
      else if (r === "/app") html = board();
      else if (r === "/blueprint") html = blueprint();
      else if (r === "/permits") html = permits();
      else if (r === "/inspection") html = inspection();
      else if (r === "/playbooks" || r.startsWith("/playbooks/") || r.startsWith("/playbook/")) html = playbooks();
      else if (r === "/launch") html = launch();
      else if (r === "/quiz") html = quiz();
      else if (r === "/assessment") html = assessment();
      else if (r === "/trucks") html = trucks();
      else if (r === "/grants") html = grants();
      else if (r === "/about") html = about();
      else if (r === "/partners") html = partners();
      else if (r === "/contact") html = contact();
      else html = home();
      document.getElementById("root").innerHTML = html;
      document.querySelectorAll("[data-check]").forEach(el => {
        el.addEventListener("change", () => {
          state.checks[el.getAttribute("data-check")] = el.checked;
          save(state); render();
        });
      });
      document.querySelectorAll("[data-ins]").forEach(el => {
        el.addEventListener("click", () => {
          state.inspect[el.getAttribute("data-ins")] = el.getAttribute("data-mark");
          save(state); render();
        });
      });
      document.querySelectorAll("[data-quiz]").forEach(el => {
        el.addEventListener("change", () => {
          state.quiz[el.getAttribute("data-quiz")] = Number(el.value);
          save(state); render();
        });
      });
      document.querySelectorAll("[data-as]").forEach(el => {
        el.addEventListener("change", () => {
          state.assessment[el.getAttribute("data-as")] = el.value;
          save(state); render();
        });
      });
      document.querySelectorAll("[data-pb]").forEach(el => {
        el.addEventListener("click", () => {
          const k = el.getAttribute("data-pb");
          state.pb[k] = !state.pb[k];
          window.__gtStay = true;
          save(state); render();
        });
      });
      if (!window.__gtStay) window.scrollTo(0,0);
      window.__gtStay = false;
    }
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
