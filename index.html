  <style>
    :root {
      --ink:#12151a; --navy:#0c1f33; --paper:#f4efe6; --cream:#fbf7f0;
      --gold:#b68a2a; --gold-soft:#e4d3a2; --fg:#1c1915; --muted:#6b6458;
      --line:#ddd3c3; --ok:#3d6b4f; --danger:#8f3a32; --card:#fffdf8;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { margin:0; font-family:"Source Sans 3", system-ui, sans-serif; background:var(--paper); color:var(--fg); }
    h1,h2,h3 { font-family: Fraunces, Georgia, serif; text-wrap: balance; }
    a { color: inherit; }
    button, [role=button] { cursor: pointer; font-family: inherit; }
    header.top { position: sticky; top:0; z-index:20; background: rgba(251,247,240,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .row { display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .brand img { width:36px; height:36px; border-radius:8px; object-fit:cover; }
    .brand b { display:block; font-family:Fraunces,serif; color:var(--navy); }
    .brand small { display:block; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-size:10px; font-weight:700; }
    nav.top a { margin-left:18px; font-size:14px; font-weight:600; color:var(--muted); text-decoration:none; }
    nav.top a:hover, nav.top a.on { color:var(--navy); }
    .btn { display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 18px; border-radius:12px; border:0; background:var(--gold); color:var(--navy); font-weight:600; text-decoration:none; }
    .btn.navy { background:var(--navy); color:var(--cream); }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
    .hero { background:var(--navy); color:var(--cream); padding: 64px 0; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); line-height:1.08; margin: 16px 0; }
    .gold { color: var(--gold-soft); }
    .grid2 { display:grid; gap:28px; grid-template-columns: 1.1fr .9fr; }
    .hero img.cover { width:100%; border-radius:28px; border:1px solid rgba(255,255,255,.1); }
    .muted { color: var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
    .layout { display:grid; grid-template-columns: 240px 1fr; gap:24px; padding: 24px 0 64px; }
    aside.board { position: sticky; top: 88px; border:1px solid var(--line); background:var(--card); border-radius:24px; padding:16px; }
    aside.board a { display:block; height:40px; line-height:40px; padding:0 12px; border-radius:12px; text-decoration:none; font-size:14px; font-weight:600; color:var(--muted); }
    aside.board a.on, aside.board a:hover { background:var(--navy); color:var(--cream); }
    .task { border:1px solid var(--line); background:var(--card); border-radius:20px; padding:16px; margin: 10px 0; }
    .check { width:22px; height:22px; border-radius:6px; border:1px solid var(--line); background:var(--cream); }
    .check.on { background:var(--ok); border-color:var(--ok); }
    footer { background:var(--navy); color:var(--cream); padding: 40px 0 20px; font-size:14px; }
    footer a { color: var(--gold-soft); }
    @media (max-width: 840px) {
      .grid2, .layout { grid-template-columns: 1fr; }
      nav.top { display:none; }
      aside.board { position: static; display:grid; grid-template-columns: 1fr 1fr; }
    }

    .chip { display:inline-flex; align-items:center; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; font-weight:600; text-decoration:none; color:var(--muted); margin:0 8px 8px 0; }
    .chip.on { background:var(--navy); color:var(--cream); border-color:var(--navy); }
    .pb-check { display:flex; gap:12px; width:100%; text-align:left; min-height:44px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--cream); font-size:14px; margin:8px 0; }
    .pb-check.on { border-color: var(--ok); background:#eef5f0; text-decoration: line-through; color:var(--muted); }
    .box { width:20px; height:20px; border-radius:6px; border:1px solid var(--line); background:var(--card); flex-shrink:0; margin-top:1px; }
    .pb-check.on .box { background:var(--ok); border-color:var(--ok); }
    .dot { width:6px; height:6px; border-radius:99px; background:var(--gold); margin-top:8px; flex-shrink:0; }
    .supply { display:inline-block; border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 12px; font-size:12px; margin:4px 4px 0 0; }
    .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:6px; background:var(--gold); }
    @media print {
      header.top, footer, aside.board, .print-hide { display:none !important; }
      .layout { display:block; padding:0; }
    }
  </style>

  <script>
    const DATA = {"PHASES":[{"id":"entity","number":"01","title":"Form the business","window":"Weeks 1–3","intent":"Get legal, banked, insured, and tax-ready before you spend a dollar on tile."},{"id":"site","number":"02","title":"Lock the room","window":"Weeks 2–8","intent":"Lease, occupancy, fire, grease, and the bones of a kitchen that can pass."},{"id":"health","number":"03","title":"Health department","window":"Weeks 4–12","intent":"Plan review, certified manager, and a permit you can hang on the wall."},{"id":"alcohol","number":"04","title":"Liquor, if you serve","window":"3–8 months","intent":"SLA is slow. Start it the day the lease is real — or skip it cleanly."},{"id":"kitchen","number":"05","title":"Kitchen systems","window":"Weeks 6–12","intent":"Equipment, sinks, cold holding, and the records inspectors actually ask for."},{"id":"menu","number":"06","title":"Menu and money","window":"Weeks 6–10","intent":"Costed recipes, allergens, vendors, and a POS that does not fight you."},{"id":"people","number":"07","title":"People","window":"Weeks 8–12","intent":"Hire, train, and schedule like the first Saturday will be busy — because it will."},{"id":"preopen","number":"08","title":"Pre-open week","window":"7 days before service","intent":"Self-inspect, dummy service, posters on the wall, first delivery in."},{"id":"thirty","number":"09","title":"First 30 days","window":"Days 1–30","intent":"The habits that keep the doors open after the ribbon is cut."}],"TASKS":[{"id":"entity-structure","phase":"entity","title":"Choose the structure (LLC is the usual call)","summary":"Most NY independents open as an LLC. Keep personal assets off the chopping block.","why":"A restaurant is a liability machine. One slip-and-fall or unpaid vendor should not take the house.","how":["Talk to a NY accountant or small-business attorney for 45 minutes — cheaper than guessing.","LLC is the default for a 16–60 seat independent. S-corp election can come later if payroll warrants it.","Do not open in your personal name. Inspectors, landlords, and insurers all want an entity."],"typicalDays":"1–2 days to decide","required":true},{"id":"entity-llc","phase":"entity","title":"File the NY LLC with the Department of State","summary":"Articles of Organization through DOS. Get the filing receipt and keep it in the binder.","why":"You cannot get an EIN, bank account, or most permits without proof the company exists.","how":["File Articles of Organization with NYS Department of State (online is fastest).","Pay the filing fee. Save the stamped filing receipt as a PDF and a paper copy.","Publish if your county still requires LLC publication — many upstate counties do. Budget for two newspapers."],"typicalDays":"1–10 days (online is faster)","required":true,"nyLink":{"label":"NYS Department of State — Business Filing","href":"https://dos.ny.gov/limited-liability-companies"}},{"id":"entity-ein","phase":"entity","title":"Get an EIN from the IRS","summary":"Free, online, same day. You need it for the bank, payroll, and sales tax.","why":"Every vendor, the state, and Square will ask for it. Do this the afternoon the LLC files.","how":["Use the IRS EIN assistant as the responsible party of the LLC.","Print the CP 575 confirmation and put it behind the DOS receipt.","Never pay a third-party site for an EIN. It is free from IRS.gov."],"typicalDays":"Same day","required":true,"nyLink":{"label":"IRS EIN assistant","href":"https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online"}},{"id":"entity-dba","phase":"entity","title":"File a DBA if the sign will not match the LLC name","summary":"Golden's Food LLC can hang a different name. County clerk files the assumed name.","why":"Banks, Square, and the health permit need the legal name and the name on the awning to connect.","how":["File the Certificate of Assumed Name with the county clerk where you operate.","Match the assumed name exactly to the sign, menus, and social accounts."],"typicalDays":"1–5 days","required":false},{"id":"entity-bank","phase":"entity","title":"Open a dedicated business checking account","summary":"EIN + LLC docs + your ID. Never mix household money with the drawer.","why":"Commingling is how good operators lose the LLC shield and cannot see if the place is making money.","how":["Bring DOS filing, EIN letter, ID, and opening deposit.","Order a debit card and a book of checks. Set up online bill pay.","Decide now: owner draw is a transfer, not a swipe at the grocery store."],"typicalDays":"1 day in branch","required":true},{"id":"entity-sales-tax","phase":"entity","title":"Certificate of Authority — NYS sales tax","summary":"Register with Tax and Finance before you sell a single coffee.","why":"Food service collects sales tax on a lot of tickets. Operating without a Certificate of Authority is a fast, ugly problem.","how":["Register on NY Business Express / Tax and Finance.","Print the Certificate of Authority and post it where staff can find it.","Know which of your items are taxable (most prepared food is). Ask your accountant once, write it down."],"typicalDays":"A few days to 2 weeks","required":true,"nyLink":{"label":"NY Business Express — sales tax","href":"https://www.businessexpress.ny.gov/"}},{"id":"entity-insurance","phase":"entity","title":"General liability, property, and workers' comp","summary":"Landlord and health department will both ask. Get quotes while the lease is in redline.","why":"One burn, one slip, one grease fire. Uninsured restaurants close. Insured ones stay in the fight.","how":["General liability is non-negotiable. Ask for restaurant-class coverage, not a generic shop policy.","If you have any employee — even one — you need workers' compensation and NYS disability.","If you lease, the landlord will require to-be-named additional insured. Get the certificate before keys.","Contents / equipment coverage matters the day the walk-in is delivered."],"typicalDays":"3–10 days for certificates","required":true},{"id":"entity-labor","phase":"entity","title":"Unemployment insurance and disability registration","summary":"NYS Department of Labor and Workers' Comp Board. Required the moment you have payroll.","why":"You will get a letter. Better that it is expected than a surprise with penalties.","how":["Register as an employer with NYS Department of Labor when you hire.","Disability (DB-120.1) and paid family leave sit with a carrier — often the same as workers' comp.","Post the required labor posters on day one of staff in the building."],"typicalDays":"1 week","required":true,"nyLink":{"label":"NYS Department of Labor — employers","href":"https://dol.ny.gov/employers"}},{"id":"entity-books","phase":"entity","title":"Set the books (and a simple weekly close)","summary":"QuickBooks or a clean spreadsheet plus Square. Know food cost every Monday.","why":"Places do not die from bad pancakes. They die from not knowing the number until the rent check bounces.","how":["Chart of accounts: food, bev, labor, occupancy, paper, repairs, owner draw.","Connect Square (or your POS) so tickets land in the books daily.","Friday close: cash counted, tips handled, invoices entered. No 'I'll catch up Sunday.'"],"typicalDays":"1–2 days to set up","required":true},{"id":"site-criteria","phase":"site","title":"Write the site criteria before you fall in love with a room","summary":"Seats, hood, grease, parking, water, neighbors, and rent as a percent of projected sales.","why":"A cheap rent with no hood is the most expensive room you will ever take.","how":["Cap occupancy rent at a number you can survive in a slow February. Independents often target 8–12% of sales.","Confirm: existing Type I hood, grease interceptor, restrooms that can pass, and a sink package that is not a teardown.","Visit at the hour you will be busiest. Count parking. Listen to the neighbors."],"typicalDays":"Ongoing until signed","required":true},{"id":"site-lease","phase":"site","title":"Negotiate a restaurant lease, not a shop lease","summary":"HVAC, grease, exclusive use, assignment, hours, and who pays when the hood dies.","why":"Generic commercial leases bury operators. Get restaurant language or walk.","how":["Spell out who owns and maintains the hood, Ansul, HVAC, and grease trap.","Get exclusive use for your concept on the plaza if you can.","Build a permitting contingency: if health or occupancy cannot be obtained in X days, you can exit.","Have a lawyer who has done food service leases read it. Not your cousin."],"typicalDays":"2–6 weeks of redlines","required":true},{"id":"site-zoning","phase":"site","title":"Confirm zoning and Certificate of Occupancy","summary":"Food service in this occupancy, this load, this use. Get it in writing from the city or town.","why":"A beautiful build-out in the wrong zone is a storage unit with a marble counter.","how":["Ask the building department: current C of O, allowed use, seating load, restroom count.","If the last use was not food service, budget time for a change of use and possibly a variance.","Keep the written answer in the binder. Verbal 'should be fine' is not a permit."],"typicalDays":"1–4 weeks","required":true},{"id":"site-building","phase":"site","title":"Building permit and fire marshal","summary":"Any hood work, walls, plumbing, or electrical needs a permit. Fire will look at suppression and exits.","why":"Unpermitted work fails the health pre-op and the insurance claim after a fire.","how":["Submit plans if you are moving walls, adding a hood, or changing occupancy load.","Ansul / hood suppression must be currently tagged. Schedule the fire inspection before health walks.","Exit signs, emergency lights, and occupant load posted. Test them."],"typicalDays":"2–8 weeks depending on the town","required":true},{"id":"site-plumbing","phase":"site","title":"Grease interceptor, mop sink, and indirect drains","summary":"Health and plumbing code both care. A missing interceptor is a stop-work.","why":"Inspectors look under the dish table. So do city sewer departments after the first clog.","how":["Confirm grease interceptor size and pumping contract.","Mop sink with chemical storage above the splash line, not in the food room.","Prep sinks and ice machines need air gaps / indirect waste. Photograph them."],"typicalDays":"Tied to build-out","required":true},{"id":"site-waste","phase":"site","title":"Dumpster, recycling, and pest contract","summary":"Signed pest control is not optional. Dumpster lids that close are not optional.","why":"The first failed inspection in a new room is often the alley, not the line.","how":["Contract a licensed pest company for monthly service and a bait map.","Dumpster on a hard pad, lids closed, away from the back door if you can.","Keep the service log in the same binder as the temp sheets."],"typicalDays":"1 week to contract","required":true},{"id":"site-ada","phase":"site","title":"Access: restroom, door, and path of travel","summary":"You will be asked. Fix it during build-out, not after a complaint.","why":"A 16-seat room still has to let people in. This is the law and it is the right thing.","how":["Check door widths, restroom grab bars, and a route from the entrance that is not a storage gauntlet.","If the building is old, document what you can reasonably do and talk to the building department."],"typicalDays":"During build-out","required":true},{"id":"site-sign","phase":"site","title":"Sign permit and awning","summary":"Cities care about the face of the block. File it; do not surprise them on opening day.","why":"A $4,000 sign sitting in a crate because of a missing permit is a stupid delay.","how":["Submit renderings with the landlord's written approval.","Confirm lighting rules if you want a night glow."],"typicalDays":"2–6 weeks","required":false},{"id":"health-call","phase":"health","title":"Call the county health department on day one of the lease","summary":"Oneida County and every other NY county have their own packet. Get it before you buy equipment.","why":"Plan review exists so you do not install a three-bay in the wrong place. Calling late is how openings slip 60 days.","how":["Ask for the food service establishment packet, plan-review checklist, and fee schedule.","Get the name of the inspector or plan reviewer. Write it in the binder.","Tell them your concept, seating, and whether you are a conversion or a raw build."],"typicalDays":"One phone call, then their calendar","required":true},{"id":"health-plans","phase":"health","title":"Submit plan review: layout, finishes, menu, equipment","summary":"Floor plan with sinks, finish schedule, equipment spec sheets, and a menu.","why":"They are looking for hand sinks in the right spots, washable surfaces, and a flow that does not cross dirty with ready-to-eat.","how":["Draw the room: cook line, prep, dish, dry storage, chemical, restrooms, hand sinks.","Finish schedule: floors, walls, ceilings — smooth, cleanable, coved base where they want it.","Attach spec sheets for every piece of refrigeration, the dish machine, and the hood.","Include a menu so they can see raw animal foods, cooling, and allergen risk."],"typicalDays":"2–6 weeks in review","required":true},{"id":"health-cfpm","phase":"health","title":"Certified Food Protection Manager","summary":"ServSafe or another ANSI-accredited course. Someone on the permit must hold it.","why":"NY expects a certified person responsible for the operation. Inspectors will ask to see the card.","how":["Take an accredited CFPM course. ServSafe Manager is the common path.","Post a copy in the office. Original in the binder.","If you are a solo operator, that person is you. Do not open hoping to 'get to it.'"],"typicalDays":"1–2 days of class + exam","required":true},{"id":"health-allergen","phase":"health","title":"Allergen awareness and the matrix on the line","summary":"Staff must be able to answer 'does this have milk?' without guessing.","why":"A wrong answer puts someone in an ambulance. Inspectors and guests both test you.","how":["Build an allergen matrix for every menu item: milk, egg, fish, shellfish, tree nuts, peanut, wheat, soy, sesame.","Train every person who takes an order. Quiz them before opening.","Mark daily specials the same day you plate them — morels, nuts, and dairy sneak in."],"typicalDays":"2–3 days to build, then ongoing","required":true},{"id":"health-policy","phase":"health","title":"Employee health policy — in writing, signed","summary":"Vomit, diarrhea, jaundice, sore throat with fever: stay home. No exceptions because you are short.","why":"One sick cook can close you. The policy is what the inspector wants to see, and it is how you sleep.","how":["Write a one-page policy. Every hire signs it on day one.","Have a coverage plan so 'I have to come in' is not the culture.","Keep the signed copies with the training log."],"typicalDays":"Half a day","required":true},{"id":"health-apply","phase":"health","title":"File the food service permit application and fees","summary":"Application, payment, CFPM proof, and any water/sewer letters they want.","why":"No permit, no open. Do not advertise a date until the application is in.","how":["Fill every blank. Incomplete packets sit at the bottom of the pile.","If you are on a well or septic (rural CNY), budget extra time for water tests.","Keep the receipt. Follow up in writing if you have not heard in the stated window."],"typicalDays":"County-dependent; often 2–4 weeks after complete packet","required":true},{"id":"health-preop","phase":"health","title":"Pass the pre-operational inspection","summary":"The room must be finished, clean, equipped, and documented. This is the gate.","why":"This is the exam. Everything in this platform exists so this hour is boring.","how":["Run the self-inspection in this app the day before. Fix every red item.","Have the binder on the desk: CFPM, pest log, temp logs (even empty, formatted), sick policy, allergen matrix.","Walk the inspector the way you walk a guest — lights on, no excuses, no wet floors."],"typicalDays":"Scheduled; have a 48-hour buffer before your advertised open","required":true},{"id":"alcohol-decide","phase":"alcohol","title":"Decide beer/wine/liquor now — it changes the calendar","summary":"SLA is measured in months. A beer-and-wine on-premises is still not a weekend project.","why":"Operators blow opening dates waiting on a license they started too late.","how":["If you need alcohol to make the numbers work, start SLA the week the lease is real.","If you do not need it (breakfast/lunch diner), skip it and stay fast. You can add later.","Budget application, notice, possible 500-foot issues near schools and churches."],"typicalDays":"Decision in a day; license in months","required":false,"nyLink":{"label":"NYS Liquor Authority","href":"https://sla.ny.gov/"}},{"id":"alcohol-file","phase":"alcohol","title":"File the SLA application and municipal notice","summary":"Fingerprints, photos, diagrams, landlord forms, and the 30-day municipal notice.","why":"Incomplete SLA files sit. Complete files still take time. Start clean.","how":["Use the current SLA packet. Do not copy a friend's 2019 version.","Serve municipal notice the way they tell you. Keep proof of mailing.","If a consultant does this, you still read every page before it goes."],"typicalDays":"2–4 weeks to assemble, then SLA's clock","required":false},{"id":"alcohol-train","phase":"alcohol","title":"Server training and ID policy","summary":"ATAP or equivalent. Written door policy. No 'they looked 30.'","why":"One sale to a minor can cost the license. The license is the business if you are a bar.","how":["Train every server and bartender before the first pour.","Post the policy. Keep a refusal log."],"typicalDays":"1 day of training","required":false},{"id":"kitchen-layout","phase":"kitchen","title":"Lock the line layout: cook, prep, dish, storage","summary":"Dirty to clean flow. Raw away from ready-to-eat. Hand sink where hands actually are.","why":"A pretty line that crosses raw chicken over the salad station will fail and will make people sick.","how":["Stand in the room and mime a ticket. If you walk through dish to get to the walk-in, redraw it.","Hand sink at cook line and at prep — stocked, not a planter.","Chemicals live in their own closet, never over food."],"typicalDays":"During plan review","required":true},{"id":"kitchen-cold","phase":"kitchen","title":"Cold holding that actually holds 41°F","summary":"Walk-in, reach-ins, prep rails. Thermometers inside, calibrated, logged.","why":"If the rail sits at 48, you do not have a prep table. You have a liability.","how":["Put a hanging thermometer in every box. Check them twice a day from day one of power-on.","Do not overload prep rails. The top inch is where you lose temperature.","Have a backup plan for a dead walk-in: ice, hotel, or close. Write it down."],"typicalDays":"Install + 48 hours of monitoring before food goes in","required":true},{"id":"kitchen-hot","phase":"kitchen","title":"Hot holding, cooking temps, and a working stem thermometer","summary":"135°F hot hold. Cook temps by protein. Calibrate weekly.","why":"Guessing doneness is how you get a visit you will not enjoy.","how":["Buy two metal-stem thermometers. Ice-point calibrate every Monday.","Post cook temps at the grill: poultry 165, ground 155, fish/pork/whole muscle 145 (and know your code).","Steam table is not a reheating method. Reheat to 165, then hold."],"typicalDays":"Equipment lead time + training","required":true},{"id":"kitchen-warewash","phase":"kitchen","title":"Dish machine or three-compartment sink that sanitizes","summary":"Wash, rinse, sanitize. Test strips on a hook, not in a junk drawer.","why":"Inspectors test the sanitizer. So should you, every day.","how":["If a machine: heat or chemical — know which, and have the right strips.","If three-bay: labeled, drainboards, and a clock so sanitizer contact time is real.","Air dry. Towels are not a sanitizer."],"typicalDays":"Install + first chemical delivery","required":true},{"id":"kitchen-storage","phase":"kitchen","title":"Storage: 6 inches off the floor, covered, FIFO, chemicals out","summary":"Shelving, labels, and the refrigerator order that keeps raw on the bottom.","why":"The walk-in is a photograph waiting to happen. Make it a good one.","how":["Shelving 6 inches off the floor. No cardboard fortress.","Ready-to-eat on top, then fish/whole meat, then ground, poultry at the bottom. Always.","Date mark anything opened or prepped. 7-day clock for 41°F holding."],"typicalDays":"One organized day","required":true},{"id":"kitchen-sds","phase":"kitchen","title":"SDS binder, first aid, and burn kit","summary":"Every chemical on the property has a sheet. Staff know where it lives.","why":"OSHA and the inspector. Also the kid who mixes something they should not.","how":["Print SDS for sanitizer, degreaser, delimer, and anything else on the rack.","First aid and burn gel not locked in the office.","Eyewash if you have the chemicals that require it."],"typicalDays":"Half a day","required":true},{"id":"menu-cards","phase":"menu","title":"Recipe cards with yield and plate cost","summary":"Every item has a card. Cost it at today's invoice, not last year's memory.","why":"If you do not know the plate cost, you are guessing the rent.","how":["One card per item: ingredients, ounces, yield, plate cost, sell price, allergen flags.","Target food cost you can live with — many independents need 28–32% on the mix, not on the hero dish.","Re-cost when the invoice jumps. Eggs and butter will jump."],"typicalDays":"3–7 days for a tight menu","required":true},{"id":"menu-specials","phase":"menu","title":"Daily specials system (the chalkboard, not a panic)","summary":"A written method for specials: cost, allergen, 86 time, and who tells the floor.","why":"Specials are how a small room stays interesting. Uncosted specials are how you work for free.","how":["Template: name, ingredients, cost, price, allergens, portion, 86 count.","If you run foraged morels or garden produce, write the source and the cook method that day.","The board matches the ticket. No oral-only specials on a Saturday."],"typicalDays":"Build the template in a day; use it forever","required":true},{"id":"menu-vendors","phase":"menu","title":"Open vendor accounts and a receiving standard","summary":"Primary broadliner, produce, bread, coffee, chemical. Reject warm protein. Always.","why":"The back door is where food safety and money both leak.","how":["Open accounts before you need product. First-order minimums will surprise you.","Receiving: check temps on protein, dates, and the invoice against the order.","Keep a local list for the things that make the room yours — bakers, farms, foragers you trust."],"typicalDays":"1–2 weeks for credit applications","required":true},{"id":"menu-pos","phase":"menu","title":"POS live: Square (or your system) with the real menu","summary":"Categories, modifiers, tax, discounts, cash drawer. Test a dummy day.","why":"Opening on a phone calculator is how tickets get lost and tax gets missed.","how":["Build the menu in the POS exactly as it will print.","Set tax the way NY wants it for your mix.","Run a fake lunch: 20 tickets, a void, a comp, a cash drop. Fix what breaks."],"typicalDays":"2–4 days","required":true},{"id":"menu-par","phase":"menu","title":"Opening par levels and a Thursday order rhythm","summary":"Do not fill the walk-in like a warehouse. Small rooms die of over-ordering.","why":"Cash in a case of product you will throw away is cash you needed for payroll.","how":["Par by item for the first two weeks based on a conservative cover count.","Order days on the calendar. Not 'when we remember.'","Prep lists from the par, not from vibes."],"typicalDays":"1 day to write, then weekly edits","required":true},{"id":"people-plan","phase":"people","title":"Staffing plan that matches the actual room","summary":"A 16-seat diner can be a solo plus one. A 60-seat night needs a real line. Write the number.","why":"Labor is the second thing that closes places. The first is not knowing labor.","how":["Schedule to covers, not to hope. Opening week is heavier. Week three should tighten.","If you are the cook, the dish, and the register, write what happens when you are sick. Now.","Budget training hours. Untrained people are more expensive than a paid shadow shift."],"typicalDays":"2 days","required":true},{"id":"people-hire","phase":"people","title":"Hire, I-9, and a one-page handbook","summary":"Legal hire packet. Then four pages max: clock, food, phones, respect, call-out.","why":"Culture is what you tolerate on day three, not what you laminated in March.","how":["I-9, W-4, state tax, direct deposit. Do it before they touch food.","Handbook: health policy, allergen, dress, no-phone on the line, how we talk to guests.","Paid trial shift if you can. Watch how they wash their hands when they think you are not."],"typicalDays":"2–4 weeks of hiring","required":true},{"id":"people-train","phase":"people","title":"Food handler training and a station walk-through","summary":"Every person: handwash, temps, allergens, 86s, and where the fire pull is.","why":"You cannot be on every ticket. Training is how your standards leave the office.","how":["A written opening checklist per station.","Quiz them on the allergen matrix and the sick policy.","Fire suppression pull, extinguisher, and evacuation — once, out loud, before guests."],"typicalDays":"3–5 training shifts","required":true},{"id":"preopen-clean","phase":"preopen","title":"Deep clean as if the inspector is in the parking lot","summary":"Ceilings, gaskets, behind the line, the alley, the restroom. Then do it again.","why":"Opening dirty sets the standard. Opening clean is easier to keep than to recover.","how":["Gaskets, hood filters, floor drains, can opener, ice machine chute.","Restroom: soap, towels, trash, a working lock, a clean fan.","Photograph the walk-in and the line the night before. If you would not post it, clean it."],"typicalDays":"2 days","required":true},{"id":"preopen-self","phase":"preopen","title":"Run the full pre-inspection in this app","summary":"Score it honestly. Fix red items before anyone official walks in.","why":"The inspector's list is not a surprise. Failing a self-audit and opening anyway is a choice.","how":["Use the Inspection tool. No 'we'll get it Monday.'","Criticals first: temps, hand sinks, sanitizer, storage order, pest.","Print or screenshot the score for the binder."],"typicalDays":"3 hours + fixes","required":true},{"id":"preopen-dummy","phase":"preopen","title":"Friends-and-family or a dummy service","summary":"Twenty real tickets. POS, plating, 86s, dish pit, and the pass. Then a debrief.","why":"Opening night is the wrong time to learn the printer is in the wrong place.","how":["Invite people who will tell you the truth.","Run it like service: tickets, times, temps, close-out.","Write three fixes. Do those fixes before the public."],"typicalDays":"One service + one recovery day","required":true},{"id":"preopen-posters","phase":"preopen","title":"Posters, choke chart, occupancy, and emergency numbers","summary":"Labor law, allergy notice, handwash signs, occupancy load, and who to call at 2 a.m.","why":"Missing posters are free points off. Missing a choke chart is worse.","how":["NYS labor posters from the official source — current year.","Handwash signs at every sink. Occupant load where the fire marshal wants it.","Emergency sheet: fire, police, plumber, hood company, health department, landlord."],"typicalDays":"Half a day","required":true},{"id":"preopen-delivery","phase":"preopen","title":"First deliveries in, dated, and put away correctly","summary":"Do not leave cases on the floor 'until later.' Later is how you fail.","why":"The first walk-in photograph should look like you meant it. Cases on the floor are how pests and inspectors both win.","how":["Receive, temp, date, shelve. Poultry on the bottom.","Break down cardboard out the back, not in the prep room.","Ice machine flushed and scooped with a handled scoop, stored outside the bin."],"typicalDays":"1–2 days before open","required":true},{"id":"thirty-open","phase":"thirty","title":"Opening and closing checklists — every shift, no exceptions","summary":"Temps, sanitizer, hand sinks, cash, 86s, and a clean line. Signed.","why":"Discipline is the product. Guests can taste when you skip it.","how":["Open: temps, sinks, sanitizer, lights, restroom, first prep list.","Close: cover, date, wipe, floors, trash, cash, notes for morning you.","If you are solo, the list is how you do not drop a ball when you are tired."],"typicalDays":"Every day","required":true},{"id":"thirty-cost","phase":"thirty","title":"Weekly food cost and a Thursday trim","summary":"Invoices vs. sales. 86 the loser. Push the winner. Order less of what died in the box.","why":"The first 30 days are where over-ordering becomes a habit or a lesson.","how":["Every Monday: last week's food purchases ÷ food sales.","Walk the walk-in with a marker. Date marks that are tired become staff meal or compost — not a hope.","Specials exist to use on-hand product with a profit, not to hide a mistake."],"typicalDays":"Monday, 45 minutes","required":true},{"id":"thirty-guest","phase":"thirty","title":"Talk to guests and fix one thing a day","summary":"A 16-seat room is a focus group. Write what they say. Change the room, not your story.","why":"You already know how to cook. The first month teaches you how this neighborhood eats.","how":["One notebook. One line per shift: what sold, what came back, what they asked for.","Do not rebuild the menu on day four. Do change the thing that failed twice.","Community is the marketing plan: names, regulars, the person at the end of the counter."],"typicalDays":"Every shift","required":true},{"id":"thirty-inspect-ready","phase":"thirty","title":"Stay inspection-ready on a random Tuesday","summary":"If they walked in during the rush, you should be bored, not scared.","why":"The second inspection is the real one. Opening-day shine fades. Systems should not.","how":["Temp logs filled. Not filled in after the fact.","Sanitizer at the right ppm. Strips not expired.","Walk-in still in the right order. If it is not, stop and fix it before the next ticket."],"typicalDays":"Every day","required":true}],"PLAYBOOKS":[{"slug":"storage-order","title":"Refrigerator storage order","kicker":"The walk-in photograph","minutes":"20 min to set · forever to keep","category":"food-safety","summary":"Ready-to-eat on top. Raw poultry on the bottom, in pans. Everything covered, labeled, and dated. This is the first thing a good inspector photographs.","why":"Gravity is not a suggestion. Raw poultry drips. If it drips onto cut fruit, leftover chili, or washed greens, you have a critical violation and a way to make people sick. Oneida County and every other NY health department will open the walk-in before they say hello.","supplies":["Sheet pans or bus pans for raw protein","Clear covers or wrap","Labels + a Sharpie","Shelf tags (RTE / seafood / ground / poultry)","A hanging thermometer in the box"],"steps":[{"title":"Empty one shelf at a time and wipe it","why":"You cannot organize around a mess. Crumbs and meat juice on a shelf are the next inspection photo.","body":"Start at the top. Pull product onto a clean cart or the prep table. Wipe the shelf with detergent, rinse, sanitize. Do not 'rearrange' dirty shelves — that is just moving the problem.","doThis":["Work top to bottom so you are not dripping dirty water onto clean food.","Toss anything with no date, bloated packaging, or a smell you would not serve.","Keep the walk-in door closed between trips. A 20-minute photo shoot will warm the box."]},{"title":"Top shelves — ready-to-eat and washed produce","why":"RTE food will not be cooked again. It cannot sit under anything that can drip.","body":"Cooked food, dairy, washed greens, leftover soups you will reheat, garnishes, sliced fruit, house sauces that will not be recooked. Covered. Dated. Name on the pan, not a mystery tub.","doThis":["Washed greens only — unwashed produce can live lower, away from RTE.","Cover every pan. Uncovered RTE under a fan is how you grow a science project.","If it is cooling, it may stay uncovered until it hits 41°F, then cover. See the cooling playbook."]},{"title":"Next — whole muscle seafood, beef, pork","why":"These cook to a lower temperature than ground or poultry. They still drip. They still do not belong over lettuce.","body":"Whole fish, steaks, chops, roasts. On trays. Not in grocery bags. Not leaking onto the shelf below.","doThis":["Tray every package. One leaky salmon filet will ruin a day's work.","Keep seafood away from dairy if the box is small — odor transfer is real."]},{"title":"Lower — ground meats and comminuted product","why":"Ground beef, sausage, meatballs, anything chopped or mixed. Leak risk is higher. Cooking temp is higher than whole muscle.","body":"These sit below whole cuts and above poultry. Always in a pan, never on a bare shelf.","doThis":["Sausage and burger in pans, not stacked in leaking chubs.","Do not park ground beef next to the cut tomatoes 'because it fits.'"]},{"title":"Bottom — raw poultry, in pans","why":"Chicken and turkey cook to 165°F. They are the last thing you want dripping. Bottom shelf is the only honest home.","body":"Whole birds, parts, ground poultry. In pans. Never in a torn case on the floor. Never above anything you will serve without a hard cook.","doThis":["If it drips, it drips into a pan, not onto ready-to-eat food.","Thaw poultry on the bottom shelf, still in a pan, still dated.","Eggs in the shell can live with poultry or on a dedicated lower shelf — not over RTE."]},{"title":"Doors, drawers, and the prep rail","why":"Inspectors open the rail during the rush. The same gravity rule applies in a 4-inch well.","body":"Prep rails follow the same logic. Do not park raw chicken next to sliced tomatoes because the well is empty. Reach-in doors: RTE at eye level, raw below.","doThis":["Label the rail pans: tomatoes, cheese, turkey, raw burger — in that spirit, RTE first.","Do not overfill. The top inch of a packed rail is 48°F while the log says 38.","Night: empty rails that will not hold 41°F overnight. Cover, date, walk-in."]}],"checklist":["Walk-in has a hanging thermometer and is at 41°F or below","Top shelves are only ready-to-eat and washed produce","Whole muscle seafood/beef/pork is below RTE, in trays","Ground meats are below whole muscle, in pans","Raw poultry is on the bottom shelf, in pans","Every pan of TCS food is covered, named, and dated","Nothing is on the floor or in leaking grocery bags","Prep rail follows the same order as the walk-in","Shelf tags are up so a new cook does not guess","I would let an inspector photograph this box today"],"mistakes":["Putting the expensive protein on top 'so it does not get stolen' — theft is not a food-code defense.","Cooling chili in a stockpot on the RTE shelf. Deep pots do not cool. See cooling.","Storing chemicals in the walk-in 'because it is cold.' Chemicals live in their own closet.","Building a cardboard city. Break boxes down the day they arrive."],"inspectorLook":"They will open the walk-in before they say hello. If they see chicken over cut fruit, the visit is already going badly. They will also open the rail and the reach-in. One wrong shelf is enough.","jeffNote":"I have watched operators argue with gravity. Gravity always wins. Put the bird on the bottom and go cook. In a 16-seat walk-in you cannot hide a bad shelf — which is a gift. Keep it honest.","related":["temps","cooling","date-mark","receiving","inspection-day"]},{"slug":"temps","title":"Temperature control","kicker":"The number that does not lie","minutes":"Twice a shift, every day","category":"food-safety","summary":"41°F or below for cold. 135°F or above for hot hold. Cook to the right number. Calibrate the thermometer. Write it down. If the paper and the food disagree, the food is the truth.","why":"Temperature is how pathogens grow or die. Inspectors will temp your rail themselves. A log you filled in at close from memory is not a log — it is a story. NY code (and every county packet) lives on these numbers.","supplies":["Two metal-stem thermometers","Ice cup for Monday calibration","Hanging thermometers in every box","A temp log (clipboard or printed sheet)","Backup batteries or a spare thermometer"],"steps":[{"title":"Calibrate every Monday — ice point","why":"A lying thermometer is worse than none. You will cook and hold to a fiction.","body":"Fill a cup with ice, add cold water, stir. Stem in the slush, not resting on the glass bottom. Wait 30 seconds. It should read 32°F. If it does not, adjust the nut under the head or replace the unit.","doThis":["Keep two thermometers. One in the pocket, one in the drawer as backup.","Digital units that cannot be calibrated get replaced. Do not 'add two degrees in your head.'","Write 'calibrated' on Monday's log so the inspector sees the habit."]},{"title":"Cold holding — 41°F or below","why":"TCS food in the danger zone is a countdown to a complaint. 45°F is not 'close enough.'","body":"Walk-in, reach-ins, prep rails, salad units, milk wells: 41°F or below in the food, not just on the display. Log morning and afternoon. If a rail is 46°F, pull product, ice it, call for service — do not 'watch it.'","doThis":["Temp the food, not the air. Stem in the thickest part of the pan.","Do not bury the rail. Overpacked wells cannot hold temperature.","A hanging thermometer in every box, readable from the door."]},{"title":"Cooking temperatures — check the thickest part","why":"Color is not a thermometer. Poultry that 'looks done' has sent people to the hospital.","body":"Poultry 165°F. Ground meats 155°F. Fish, pork, and whole-muscle steaks 145°F (know your local code — some jurisdictions differ on pork and fish). Check the center, not the edge.","doThis":["Post the cook-temp card at the grill. Staff should not have to remember poetry.","Clean the stem between proteins. A dirty stem is a cross-contact tool.","If you are running a vegan special on the same flat top, that is a different playbook — allergens."]},{"title":"Hot holding — 135°F or above","why":"The steam table is a holding tool, not a microwave. Food that sits at 120°F is in the danger zone with a lid on.","body":"Hold hot TCS food at 135°F or above. Stir wells. Temp the food, not the well setting. If it drops, reheat correctly (see cooling/reheat) or discard.","doThis":["Do not stack pans in a well so the bottom one steams and the top one dies.","Soup and gravy get stirred and temped — skin on top lies.","Breakfast steam table at 10:45: if it is 128°F, it is not 'almost lunch.' It is a discard."]},{"title":"Log it like you mean it","why":"Inspectors compare the paper to the product. If they disagree, they believe the product and they remember the paper.","body":"Morning and afternoon, every unit. Real numbers, real time, real initials. Filling the week on Sunday night is how you train yourself to lie.","doThis":["The log lives on a clipboard, not in a drawer under takeout menus.","Corrective action column: what you did when a unit was out. Pull / ice / service call / discard.","Keep 30 days of logs in the binder. More if your county asks."]}],"checklist":["Two working stem thermometers on the property","Monday ice-point calibration done and noted","Hanging thermometer in every cold box","Walk-in holding 41°F or below (food, not just air)","Prep rail holding 41°F or below during service","Hot wells holding 135°F or above in the food","Cook-temp card posted at the line","Today's morning temps logged with real numbers","Today's afternoon temps logged with real numbers","Out-of-range units have a written corrective action"],"mistakes":["Temping the air in the walk-in and calling it a food temp.","Leaving the stem in a sanitizer bucket so the next reading is a chemical bath.","A rail at 46°F 'because it is busy.' Busy is when you ice the pans, not when you ignore them.","Reconstructing a week's log the morning of an inspection."],"inspectorLook":"They will ask for the log and then temp the rail themselves. If the paper and the product disagree, they believe the product. They will also ask you to calibrate in front of them. Know the ice-point trick cold.","jeffNote":"I taught this for Compass Group in the '90s and I still walk to the box with a stem thermometer at 5 a.m. Ink on a clipboard only matters if it matches the food. In a 16-seat room there is no hiding a warm rail — the guest is sitting on it.","related":["cooling","storage-order","opening","inspection-day"]},{"slug":"cooling","title":"Cooling and reheating","kicker":"The stockpot is not a method","minutes":"The two-stage clock","category":"food-safety","summary":"135°F to 70°F in 2 hours, then to 41°F in 4 more. Shallow pans, ice baths, uncovered while cooling. Reheat leftovers to 165°F in two hours or less. Chili in a deep pot overnight is how people get sick.","why":"Cooling is where good kitchens fail. Bacteria wake up in the danger zone. A covered 5-gallon pot in the walk-in looks tidy and stays hot in the center until morning. Inspectors know this. So do outbreak investigators.","supplies":["Hotel pans / shallow pans (2-inch)","Ice and a prep sink or tub for ice baths","Stem thermometer","Labels","An ice paddle if you batch stocks"],"steps":[{"title":"Know the two-stage clock","why":"This is the law and the science. Not a chef preference.","body":"Hot TCS food must go from 135°F to 70°F within 2 hours, then from 70°F to 41°F within 4 more hours (6 hours total). If you miss the first gate, you cannot 'catch up' in the walk-in. Discard or recook per your policy — do not gamble.","doThis":["Write the time and temp when you pull it off the heat.","Check at 2 hours. If it is still above 70°F, ice-bath immediately or discard.","Check again when you cover it for overnight. It must be 41°F."]},{"title":"Shallow pans beat deep pots","why":"The center of a stockpot does not know it is in a walk-in.","body":"Transfer soups, gravies, beans, chili, and cooked proteins into 2-inch pans. Ice bath first if it is still screaming hot. Stir. Uncover until 41°F, then cover, date, and shelf correctly.","doThis":["Do not stack cooling pans. Air has to move.","An ice wand or paddle in a stock is legal help — still temp the center.","Cut large roasts. A 12-pound piece of meat is a cooling failure waiting."]},{"title":"Reheat leftovers to 165°F","why":"The steam table will not save you. Reheating is a cook step.","body":"Leftovers that were cooled correctly get reheated to 165°F within 2 hours, then held at 135°F. The well is for holding, not for waking up yesterday's soup.","doThis":["Stove, kettle, or oven — not a 140°F well 'eventually.'","Temp the center. Stir. Then it may go to the well.","If you cannot get it to 165°F in two hours, discard. You already used your luck."]},{"title":"Never cool at room temperature 'until it stops steaming'","why":"The counter is the danger zone with better lighting.","body":"A brief rest to stop aggressive steaming is not a 90-minute counter nap. Get it into an ice bath or a shallow pan and into the process.","doThis":["Set a timer when you pull a pot. Timers do not get busy.","Train the crew: uncovered in the walk-in while cooling is correct. Covered and deep is not."]}],"checklist":["Shallow pans available (not just stockpots)","Ice available for baths during prep","Cooling times written on the pan or a cooling log","No deep covered pots of yesterday's soup in the walk-in","Leftovers reheated to 165°F before the well","Stem thermometer used on cooling and reheating, not guesswork","Covered and dated only after the food hits 41°F"],"mistakes":["Lid on, in the walk-in, 'check tomorrow.' That is a stockpot incubator.","Cooling on the counter because 'the walk-in is packed.' Pack less. Cool right.","Reheating in the steam table from 40°F. It will spend hours in the danger zone.","Freezing a hot pot 'to cool it faster' and creating a warm doughnut around a frozen rim."],"inspectorLook":"They will ask how you cool the soup. If you point at a stockpot, the conversation changes. They may temp the center of anything that looks like it was cooled wrong.","jeffNote":"I have thrown out chili I was proud of because I got tired and left it deep. Pride does not kill bacteria. Shallow pans do. Do the extra transfer. Morning you will still have soup.","related":["temps","date-mark","storage-order","closing"]},{"slug":"handwashing","title":"Handwashing that actually happens","kicker":"The cheapest control you have","minutes":"20 seconds, all day","category":"food-safety","summary":"Dedicated sink, hot water, soap, towels, a trash within reach. Hands washed after raw, after restroom, after phone, after money, after trash. Gloves over dirty hands are gift wrap on a problem.","why":"Hands move the kitchen. They also move norovirus, raw-poultry juice, and whatever was on the phone. Inspectors watch without announcing it. In a 16-seat room the guest can see the sink. That is not a problem if you use it.","supplies":["Dedicated hand sink (unblocked)","Soap","Paper towels","Trash can at the sink","Handwash sign","Gloves that actually fit"],"steps":[{"title":"The sink is not a dump station","why":"If it is blocked, people will not use it. That is on you, not them.","body":"No bus pans, no utensils, no food, no 'just a second' hotel pan. A hand sink that is a shelf is a citation. Clear it on the open list and again at 11 a.m. when the rush invents storage.","doThis":["Photograph the sink at open if you have a crew that 'forgets.'","If you only have one sink, it still cannot be the vegetable dump. That is why plan review exists."]},{"title":"Stock it like you mean it","why":"Empty soap is a closed sink. Cold water is a closed sink. No towels means wet hands on the apron — which is not washing.","body":"Soap, paper towels, water that is actually hot, a trash can for the towels. Check it on the opening list. Restock before the rush, not after someone yells.","doThis":["Backup soap and towels in the dry storage, not 'I'll grab some tomorrow.'","A sign at every hand sink, including the restroom. Required and useful."]},{"title":"When you wash — the real list","why":"People remember 'after the restroom' and forget the phone, the trash, the raw egg, the money, the floor.","body":"Before prep. After raw protein. After restroom. After eating. After handling money or the phone. After taking out trash. After touching the face, hair, or the floor. After cracking eggs. After handling dirty dishes, then plating.","doThis":["20 seconds. Soap. Rinse. Towel. Not a rinse under cold water while talking.","If you are solo, the register is a contamination event. Wash or glove-change before you go back to RTE."]},{"title":"Gloves are a tool, not a force field","why":"Gloves over dirty hands are how you stamp raw chicken onto every bun.","body":"Wash, then glove. Change gloves between raw and ready-to-eat. Change when they tear. Change after you touch the trash, the phone, or your face. Bare-hand contact with RTE food is a critical in most NY counties.","doThis":["Keep sizes that fit. Giant gloves that fall off get 'adjusted' with contaminated hands.","Tongs and deli paper are legal alternatives — still after washing."]}],"checklist":["Hand sink unblocked and not used as a dump","Hot water, soap, towels, trash at the sink","Handwash sign posted at every hand sink and restroom","Gloves in the right sizes at the line","Staff (including you) can name when they must wash","No bare-hand contact with ready-to-eat food","Restroom sink is stocked the same as the line sink"],"mistakes":["Washing at the prep sink 'because it is closer.' That is not a hand sink.","Wiping hands on the apron and calling it done.","Double-gloving instead of washing. You just made a warmer petri dish.","A cook who cracks eggs and then plates toast. The citation writes itself."],"inspectorLook":"They watch without announcing it. If a cook cracks eggs and then plates toast, the citation writes itself. They will also check that the sink is stocked and unblocked at the moment they walk in — not 'usually.'","jeffNote":"In a 16-seat room you are five feet from the guest. They can see the sink. Act like it. I have lost the argument with myself at 2 p.m. when I was the dish and the cook. The list is how I still wash.","related":["sanitizing","opening","allergens","sick"]},{"slug":"date-mark","title":"Date marking and leftovers","kicker":"Seven days, then it is gone","minutes":"As you prep, every pan","category":"food-safety","summary":"Opened TCS food and prepped food get a date. Hold at 41°F. Seven days including the day you made it. Freeze stops the clock. When in doubt, throw it out. Staff meal is not a loophole.","why":"Listeria and friends do not care that the chili still smells fine. Date marking is how a small walk-in stays honest. Inspectors will pull a pan at random and ask you to read it. Hesitation is an answer.","supplies":["Labels that stick on cold pans","One Sharpie system (not three brains)","A written rule posted in the walk-in","A discard tub so 'maybe' has a home"],"steps":[{"title":"What gets a date","why":"If it is TCS and you opened it, cooked it, or prepped it, it gets a mark.","body":"Soups, meats, cut tomatoes, cut melons, cooked noodles, house sauces, opened milk, sliced cheese, leftover specials. Commercially made and unopened can follow the manufacturer — once you open it, your clock starts.","doThis":["Cut leafy greens and cut tomatoes are TCS. Date them.","A hotel pan of cooked chicken for the week is not 'prep.' It is a 7-day product."]},{"title":"One marking system","why":"Three Sharpies with three brains is how pans become mysteries.","body":"Pick one: day made / day discard, or a single use-by date everyone can read. Write the name of the food. 'Sauce' is not a name. Post the rule inside the walk-in door.","doThis":["Train it on day one. Quiz it on day three.","If a pan has no date, it has no home. Discard. Do not invent a date from memory."]},{"title":"The seven-day clock","why":"NY follows the FDA 7-day hold at 41°F, counting today as day one.","body":"Made Monday, discard Sunday. Freeze stops the clock. Thawing restarts you at the remaining days, not a new seven. If it spent time above 41°F, the clock is not your friend — discard.","doThis":["FIFO: new product behind old. The date makes FIFO possible.","Walk the box every close. Tired dates become compost, not hope."]},{"title":"Staff meal is not a loophole","why":"Feeding the crew something you would not serve a guest trains the wrong standard.","body":"If it is past date, it is trash. Not staff meal, not 'soup for the regular,' not a smoothie special. You already used the seven days.","doThis":["Put a discard bucket in the walk-in so the decision is physical.","If you are throwing away a lot, you are over-prepping. That is a costing problem. See menu costing."]}],"checklist":["Written date-mark rule posted in the walk-in","Every opened/prepped TCS pan has a name and a date","The system is one method, used by everyone including you","Nothing past 7 days is still on a shelf","No undated mystery tubs","FIFO is visible — old product in front","Discarded food is actually discarded, not 'staff meal'"],"mistakes":["Dating the lid and then swapping lids.","A tub labeled 'Monday' with no year and no food name, from a Monday two weeks ago.","Freezing, thawing, and writing a new 7-day date as if the food were new.","Keeping a 'maybe' shelf. There is no maybe shelf."],"inspectorLook":"They will pull a pan at random and ask you to read the date. If you have to turn it around, squint, and tell a story, they already know. They will also ask what you do with expired product.","jeffNote":"A small walk-in makes you honest. If you cannot see the date, you have too much product. I 86 specials so the box stays readable. That is not a loss. That is how the diner stays open.","related":["storage-order","cooling","costing","closing"]},{"slug":"allergens","title":"Allergen control","kicker":"No guessing at the pass","minutes":"Build once · check every special","category":"food-safety","summary":"Milk, egg, fish, shellfish, tree nuts, peanut, wheat, soy, sesame. A matrix for the menu. A method for specials. The only legal sentence when you are unsure is 'let me check the card.'","why":"A wrong answer puts someone in an ambulance. Cross-contact is contact. Shared fryer oil, a buttered morel special, a vegan plate on a fish-smeared board — those are how 'we are careful' becomes a hospital. Inspectors and guests both test you.","supplies":["Allergen matrix at the pass","Recipe cards with flags","Dedicated pans/boards if you run vegan or allergy plates","A red 'allergy' ticket flag on the POS"],"steps":[{"title":"Build the matrix for every menu item","why":"Staff cannot memorize 40 dishes under pressure. The card is the brain.","body":"Rows are dishes. Columns are milk, egg, fish, shellfish, tree nuts, peanut, wheat, soy, sesame. Mark contains / may contain (shared fryer, shared board). Include garnishes, buns, and the butter you finish with.","doThis":["Build it from recipe cards, not from memory.","Reprint when the menu changes. A stale matrix is a trap.","Keep a copy at the pass and a copy in the binder."]},{"title":"Specials and foraged items get the same card","why":"The chalkboard is where allergens sneak in.","body":"Morels cooked in butter are a dairy dish. Say so on the board. A vegan special that hit a fish pan is not vegan. Nuts on a salad 'just today' must hit the matrix before the first ticket.","doThis":["Template for specials: name, ingredients, allergens, 86 count.","If you cannot flag it, you cannot run it."]},{"title":"The sentence staff must use","why":"Confidence is not a control. The card is.","body":"'Let me check the card.' Never 'should be fine,' never 'we're a diner so probably,' never 'I don't think so.' Then read the card out loud to the guest if they want it.","doThis":["Role-play this in training. Make it muscle memory.","POS modifier: ALLERGY — so the ticket is marked and the line slows down."]},{"title":"When you cannot control it, say no","why":"A lost ticket is cheaper than a hospital and a lawyer.","body":"If the fryer is shared and they cannot have wheat, you may not have a safe fry. If you cannot give a dedicated pan, board, and oil, decline. Be kind. Be clear. Do not improvise a 'rinse.'","doThis":["Write the 'we cannot do this safely' list so staff are not inventing yes.","Vegan in a meat-and-eggs diner only works if the pan, the board, and the story match."]}],"checklist":["Matrix covers every current menu item and the nine major allergens","Shared fryers and boards are marked as may-contain","Specials are flagged the day they run","Card lives at the pass, not in a drawer","Staff can demonstrate 'let me check the card'","POS has an allergy modifier or ticket stamp","There is a written list of items you will refuse to 'make safe' on the fly"],"mistakes":["Saying 'vegan-friendly' as if vegan meant allergen-free.","Rinsing a nut-contaminated pan and plating an allergy order.","The fryer that cooked fish yesterday and fries the 'safe' potatoes today.","A server guessing because the line is in the weeds."],"inspectorLook":"They may ask a server a direct allergen question. The right answer is the card, not confidence. They may also ask how you handle a guest who declares an allergy at the counter.","jeffNote":"I run vegan specials in a meat-and-eggs diner. That only works because the pan, the board, and the story match. I have said no to a modification I could not stand behind. Keep the guest. Keep your name.","related":["costing","opening","handwashing","inspection-day"]},{"slug":"sanitizing","title":"Cleaning and sanitizing","kicker":"Wash, rinse, sanitize, air dry","minutes":"All day","category":"food-safety","summary":"Soap removes. Sanitizer kills what is left on a clean surface. Dirty plus sanitizer is perfume on a problem. Right chemical, right ppm, right contact time, then leave it alone.","why":"Inspectors dip a strip in your bucket. They also look at the slicer, the can opener, and the gaskets. A pretty dining room with a filthy pit is not a clean restaurant. It is a performance.","supplies":["Detergent","Sanitizer (chlorine or quat) matching your strips","Test strips in date","Labeled buckets","Wiping cloths","SDS sheets in the binder"],"steps":[{"title":"The order never changes","why":"Sanitizer does not cut grease. Grease does not get sanitized. It gets hidden.","body":"Wash with detergent. Rinse. Sanitize at the correct concentration. Air dry. Towel-drying food-contact surfaces re-soils them. This is warewashing and it is in-place cleaning.","doThis":["Boards and knives between raw and RTE — the full order, not a sanitizer wipe on raw chicken juice.","Slicer, can opener, and prep tables are hiding places. Take them apart."]},{"title":"Test the bucket. Every bucket.","why":"Too weak does nothing. Too strong is not more professional. Expired strips are a prop.","body":"Chlorine or quat — match the chemical to the strip. Mix to the ppm on the spec sheet (commonly 50–100 ppm chlorine or 200–400 ppm quat — follow your label). Change buckets when they look like soup, not only at close.","doThis":["Strips on a hook, not in a junk drawer.","Label the bucket. 'Sanitizer' not 'water.'","Wiping cloths live in the bucket, not on a cutting board, not in a pocket."]},{"title":"Night work is the real clean","why":"Guests never see gaskets. Inspectors always do.","body":"Floors, drains, gaskets, behind the line, the can opener, the ice chute, the floor sink. Degrease. Do not perfume. The things you skip on a tired Tuesday are the photo on a surprise Wednesday.","doThis":["Gaskets pulled and cleaned, not just wiped on the face.","Floor drains: brush, not just a splash of bleach on standing water."]}],"checklist":["Sanitizer mixed and tested today, correct ppm","Strips match the chemical and are not expired","Buckets labeled; cloths in the bucket","Three-bay or machine set up in order: wash, rinse, sanitize","Boards and knives cleaned between raw and RTE","Slicer / can opener clean and dry","SDS sheets in the binder for every chemical","Chemicals stored away from food"],"mistakes":["Mixing by eye because 'it smells clean.'","Using sanitizer as a first wash on a greasy board.","Leaving cloths on the line overnight to dry into a science project.","A bleach bucket strong enough to strip steel and still calling it food-safe."],"inspectorLook":"They dip a strip in your bucket. Have a bucket. They will also run a finger along a gasket and look at the can opener. Those two tell the truth about last night.","jeffNote":"Chemical is not a personality. Right ppm, right time, then leave it alone. I have cleaned a pit at 8 p.m. when I wanted to go home. Fruit flies are how the room argues back if you do not.","related":["warewashing","opening","closing","pest"]},{"slug":"warewashing","title":"Dish machine and three-bay","kicker":"The pit is a control point","minutes":"Set at open · watch all day","category":"food-safety","summary":"Wash, rinse, sanitize, air dry. A machine that is 'on' is not a machine that is sanitizing. Drainboards. Test strips. Nothing towel-dried that will touch food.","why":"Dirty plates come back as a guest problem. Unsanitized plates come back as an outbreak. The pit is where tired crews cut corners. Inspectors know. Set it at open so the 2 p.m. you does not invent a method.","supplies":["Dish machine or labeled three-bay","The right test strips (heat or chemical)","Drainboards or racks","Delimer on a schedule","A clock if you use a chemical bay"],"steps":[{"title":"Know which sanitizer you have","why":"Heat machines and chemical machines fail in different ways. The wrong strip is theater.","body":"High-temp machines need a 160°F+ plate surface (follow your machine — many need 180°F rinse). Chemical machines need the right ppm. Three-bay needs labeled wash / rinse / sanitize and contact time.","doThis":["Read the data plate on the machine. That is the law for your unit.","If the booster is down, the machine is down. Wash in the three-bay or stop."]},{"title":"Set the pit at open","why":"A cold machine on the first ticket is how you send dirty cups to the counter.","body":"Fill, heat, or prime. Check strips or the gauge. Clear drainboards. Scrap buckets empty. This is on the opening list, not 'once we get a stack.'","doThis":["Run a test rack. Look at the gauge. Do not trust a green light from 2019.","Air-dry racks ready. Towels are not the last step."]},{"title":"During service: scrape, wash, do not flood the clean side","why":"Clean and dirty have to stay divorced. A stacked clean rack under a dirty bus tub is a joke the inspector does not laugh at.","body":"Scrape. Rack the same way every time. Do not overload. Do not run a rack of greasy pans and call a cup on the end 'clean.'","doThis":["Pre-soak carbon, do not pray.","If you are solo, pre-close the pit in the lull. A mountain at 2:30 is how corners get cut."]}],"checklist":["Machine or three-bay set up before the first ticket","Correct strips in date, matching heat or chemical","Data plate readable on the machine","Drainboards / clean racks not mixed with dirty","Air dry — no towel on food-contact surfaces","Delimer / clean cycle on a written schedule","If the machine fails, a backup method is ready"],"mistakes":["Running the machine with no chemical because the jug is empty and the lunch line is long.","Towel-drying 'so it looks nice' and putting the towel's bacteria back on the plate.","A three-bay with all three sinks full of dirty water and no labels."],"inspectorLook":"They will ask you to run a rack or dip a strip. They will look at the clean side. A wet, stacked, towel-wiped pile is not clean.","jeffNote":"I am the dishwasher in this diner. The pit is not beneath the work. The pit is the work. If the machine is down I still have a three-bay. That is the backup, not a speech.","related":["sanitizing","opening","closing","temps"]},{"slug":"pest","title":"Pest prevention","kicker":"The alley tells on you","minutes":"Daily eyes · monthly service","category":"daily","summary":"Sealed doors, closed dumpsters, no cardboard cities, a licensed tech with a map. You cannot spray your way out of crumbs. The first failed inspection in a new room is often the alley, not the line.","why":"Droppings, gnawed bags, fruit flies in a drain, a wide-open dumpster next to a screen door — that is a critical conversation. DIY bombs in a food room are how you close. Licensed service plus daily discipline is how you stay open.","supplies":["Licensed pest contract + bait map","Door sweeps","Dumpster with a lid that actually closes","Drain brush","A service log in the binder"],"steps":[{"title":"Contract a licensed company","why":"Inspectors will ask for the log and the license. A hardware-store fogger is not a program.","body":"Monthly service at minimum. Bait map. Tech name and license if your county wants it. Keep the log in the same binder as the temp sheets. Meet the tech once so they know your alley, not just your front door.","doThis":["Do not move bait stations 'because they look ugly.' Tell the tech if you need them shifted.","If you see activity, call. Do not wait for the monthly."]},{"title":"Doors, docks, and daylight","why":"If you can see daylight under the door, so can a mouse.","body":"Sweeps on the back door. Screen if it stays open in summer. Dock plates tight. The front door during a rush is a highway — a second set of eyes, not a brick holding it open all afternoon.","doThis":["Stand outside and look at the light under the door at night.","Fix the sweep the week it tears, not the week of inspection."]},{"title":"The dumpster is part of the kitchen","why":"Inspectors walk the alley. Raccoons already live there. You do not have to feed them.","body":"Lids closed. Pad reasonably clean. Distance from the door if the lot allows. Spills rinsed, not left. Cardboard broken down so it is not a hotel.","doThis":["Close lids every trip, including the last trip at night.","If the hauler leaves it open, call them. Photograph it. That is your evidence."]},{"title":"Inside: crumbs, drains, cardboard","why":"Fruit flies breed in the drain you 'cleaned' by pouring bleach on standing water.","body":"No food overnight on the line. Floor drains brushed. Dry storage off the floor. Break down boxes the day they arrive. Mops hung, not sitting in soup.","doThis":["Night: no open product on the line. That is a buffet.","A drain brush on a hook. Use it."]}],"checklist":["Licensed pest contract current","Bait map and last service log in the binder","Back-door sweep installed; no daylight","Dumpster lids closed and pad acceptable","No cardboard fortress in dry storage","Floor drains cleaned with a brush, not just bleach","No food left on the line overnight","No evidence of droppings, gnawing, or fruit-fly breeding"],"mistakes":["A can of spray 'for emergencies' used as the program.","Propping the back door all summer because the kitchen is hot. Buy a fan that does not require a mouse highway.","Leaving the dumpster open 'for a minute' that becomes overnight."],"inspectorLook":"Droppings, gnawed bags, or a wide-open dumpster next to the screen door — that is a critical conversation. They will ask for the pest log. Have it.","jeffNote":"I have a swampy back lot and I still win this. Closed lids and a real pest contract. Not hope. The alley is the first impression for the person who can close you.","related":["closing","receiving","opening","inspection-day"]},{"slug":"opening","title":"Daily opening","kicker":"Before the lights hit the board","minutes":"25–40 min","category":"daily","summary":"A written list so a tired brain does not skip the rail temp. Sign it. That signature is the standard. Temps, sanitizer, sinks, restroom, board, drawer — then you cook.","why":"Opening is when you decide whether today is a system or a scramble. Inspectors love a completed open log from this morning. Guests can taste the difference between a room that was walked and a room that was unlocked.","supplies":["Printed opening checklist","Stem thermometer","Sanitizer + strips","Restroom stock","The dated specials card"],"steps":[{"title":"Walk the room like a guest","why":"You eat last. They eat first. The dining room is the product.","body":"Restroom stocked (soap, towels, trash, a working lock). Dining wiped. Lights. Music at a level you would eat under. Board matches the POS. Choke chart and occupancy still on the wall.","doThis":["Sit in a chair for five seconds. If the table rocks or the ketchup is crusted, fix it.","If the board and the POS disagree, the POS is what they will be charged. Align them."]},{"title":"Temps and sanitizer before food hits a board","why":"A warm rail at 10 a.m. is a discard at 10:05, not a hope until lunch.","body":"Every box, the rail, the dish machine or three-bay. Log real numbers. Mix sanitizer, test strips, buckets labeled. Hand sinks stocked and unblocked.","doThis":["Corrective action if a unit is out: pull, ice, service call. Write it.","Stem thermometer in the pocket, not the drawer."]},{"title":"Line, prep list, 86s","why":"Morning you should be cooking and greeting, not discovering there is no bacon.","body":"Cutting boards out. First prep list from pars, not from vibes. 86 list from last night reviewed. Specials costed and allergen-flagged.","doThis":["If you are solo, the prep list was written last night. See closing.","Allergy card current if a special is running."]},{"title":"Money","why":"A drawer that does not count will steal from you all day.","body":"Drawer counted. Starting bank written. Card machine alive. A void/comp plan so you are not inventing policy at the counter.","doThis":["Count twice if you are tired. 5 a.m. math lies.","See cash control."]}],"checklist":["Opening list printed and signed with today's date","Restroom stocked; dining presentable","All cold units logged; rail at 41°F or below","Hot equipment on and safe","Sanitizer mixed and tested","Hand sinks stocked and clear","Dish machine or three-bay ready","Board matches POS; specials allergen-flagged","Drawer counted; starting bank written","86 list from last night reviewed"],"mistakes":["Unlocking, putting on coffee, and calling that an open.","Skipping temps because 'it was fine yesterday.'","A special on the board that is not in the POS and not on the allergen card."],"inspectorLook":"A completed open log from this morning is a quiet, beautiful thing to put in someone's hand. Empty logs with perfect numbers for a week are the opposite.","jeffNote":"I start around 5 a.m. The list is how the room is ready when the first regular walks in, even if I slept poorly. Pride without a list is just hope with a key.","related":["temps","closing","cash-control","allergens","solo"]},{"slug":"closing","title":"Daily closing","kicker":"Morning you is a guest","minutes":"30–50 min","category":"daily","summary":"Cover, date, wipe, floor, trash, cash, a note. Leave the room the way you wanted to find it at 5 a.m. Solo operators skip close when they are cooked. That is how the fruit flies start.","why":"Inspectors do surprise visits at close. A clean pit at 2 p.m. is good. A clean pit at night is the culture. Morning you will judge last night with no patience. Be kind to that person.","supplies":["Closing checklist","Labels and covers","Trash bags","Dumpster access","A three-line notebook for morning"],"steps":[{"title":"Food first — cover, date, correct shelf","why":"A rail left full overnight in a unit that cannot hold is a discard with extra steps.","body":"Cover, date, correct shelf. Nothing cooling in a deep pot. Rails emptied if they will not hold overnight. FIFO the walk-in while you are already standing in it.","doThis":["Walk-in photograph in your head: would you post it? If not, fix it.","Discard tired dates now, not tomorrow when you are in the weeds."]},{"title":"Line and dish","why":"Grease overnight is a pest invitation and a fire load.","body":"Wipe, degrease, floors, mats hung if that is your system. Dish pit empty. Machine drained per the maker. Gaskets wiped. Can opener clean.","doThis":["Pre-close during the last lull so you are not doing the whole pit at empty.","If you are dragging, still do the last ten minutes. That is the whole game."]},{"title":"Trash, pests, lock","why":"The last dumpster trip is the one people skip. That is the one the raccoon keeps.","body":"Trash out. Dumpster lids closed. Back door locked. Lights as needed. No open product on the line. Floor drains not standing.","doThis":["Lids. Every time.","A look under the back door for daylight before you leave."]},{"title":"Cash and three lines for morning","why":"Uncounted drawers invent theft and hide mistakes.","body":"Count, drop, tip out. Three lines for morning: what 86'd, what broke, what to order. That note is the opening of tomorrow's prep list.","doThis":["If the drawer is short, write it. Do not 'make it up' from the tip jar.","See cash control."]}],"checklist":["All TCS food covered, dated, on the right shelf","Rails emptied if they will not hold overnight","No deep pots cooling in the walk-in","Pit empty; machine shut down per spec","Floors, mats, gaskets, can opener done","Trash out; dumpster lids closed","Back door locked; sweep in place","Drawer counted; drop done; note written for morning","Closing list signed"],"mistakes":["Leaving the rail set 'so morning is faster.' Morning is a warm rail and a fight.","Skipping the dumpster because it is raining.","A drawer that 'will count tomorrow.' Tomorrow you will not remember."],"inspectorLook":"They do surprise visits at close. A clean pit at night is the culture. They will also open the walk-in at 8 p.m. and expect the same photograph as noon.","jeffNote":"Solo operators skip close when they are cooked. That is how the fruit flies start. Stay for the last ten minutes. I have talked myself into leaving. The list talks me out of it.","related":["opening","date-mark","pest","cash-control","cooling"]},{"slug":"receiving","title":"Receiving and vendors","kicker":"The back door is a control point","minutes":"Every delivery","category":"daily","summary":"Be there. Temp protein. Check dates and the invoice. Reject warm product. Put it away before the next ticket. A signed invoice for food you did not check is your problem, not the driver's.","why":"You cannot cool your way out of a temperature-abused delivery. 48°F chicken in a case does not become safe because your walk-in is good. The back door is where food safety and money both leak.","supplies":["Stem thermometer","A receiving corner that is not the cook line","A pen for the invoice","A place to break down cardboard immediately"],"steps":[{"title":"Be there or do not let them dump","why":"Drivers are paid to finish a route. You are paid to serve safe food.","body":"If you cannot receive, do not let them leave product in the alley. A signed invoice for food you did not check is your problem when the inspector asks, and when the credit window closes.","doThis":["Post receiving hours on the door if you are solo.","Train one backup person to receive if you have a crew."]},{"title":"Temp protein and look at frozen","why":"48°F poultry is a reject, not a discount.","body":"Cold items 41°F or below. Frozen still frozen, no thawed-and-refrozen ice crystals as a surprise. Open a case if it looks wet. If it is wrong, refuse it. Call the house from the dock, not after you put it away 'to be nice.'","doThis":["Write the temp on the invoice if it was a close call you accepted.","I have turned a driver around. He did not like it. The inspector never had to."]},{"title":"Invoice vs. order","why":"Myst
